# Publica o produto (painel e ficha do produtor) no GitHub Pages: https://bernardoemmel.github.io/Raiz/
#
# O site é estático: o build baixa do Release "dados" o que o motor publicou (front/scripts/baixar-dados.mjs) e grava
# os CSV limpos e comprimidos, os estados, os pontos de cada estado e as fichas prontas (vite-dados.ts). As geometrias
# do mapa saem de front/scripts/geo.py, guardadas em cache entre as rodadas. Roda a cada mudança do front na main, todo
# dia (dados novos do motor), após a coleta do Calendário e quando alguém dispara (Actions, "Publicar o site").
#
# Uma vez só, no repositório: Settings > Pages > Build and deployment > Source: "GitHub Actions". O token do Actions não
# consegue ligar o Pages sozinho; sem isso, o passo "publicar" falha com o aviso do GitHub.
name: Publicar o site

on:
  push:
    branches: [main]
    paths: ["front/**", ".github/workflows/publicar-site.yml"]
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Calendário diário da Raíz"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  construir:
    # Uma fonte indisponível deixa a coleta vermelha, mas o passo always publica o snapshot parcial.
    # Não filtrar por conclusion=success: o site precisa mostrar também essa cobertura incompleta.
    # workflow_run pode ter permissões elevadas; só aceitamos a coleta da main deste repositório,
    # originada pela agenda ou pelo disparo manual. Nunca executamos o código do head recebido.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Dependências de publicação travadas
        run: uv sync --frozen --no-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            front/globo/package-lock.json
            front/produtor/package-lock.json

      - name: Dados do motor e polígonos de todos os estados (Release dados)
        run: node front/scripts/baixar-dados.mjs --geo --exigir

      - name: Conferir os três lotes publicados do Pará
        run: node front/scripts/baixar-lotes.mjs

      - name: Geometrias do mapa (do cache)
        uses: actions/cache/restore@v4
        with:
          path: front/geo
          key: geo-${{ hashFiles('front/scripts/geo.py') }}-${{ github.run_id }}
          restore-keys: geo-

      - name: Desenhos de todos os municípios publicados e fundo compartilhado por estado
        run: |
          uv run --frozen --no-dev python front/scripts/geo.py --dados dados/estados

      - name: "Guardar as geometrias (mesmo as de uma rodada pela metade: o geo.py só baixa o que falta)"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: front/geo
          key: geo-${{ hashFiles('front/scripts/geo.py') }}-${{ github.run_id }}

      - name: Conferir o mapa
        run: |
          for f in indice.json brasil_municipios.geojson brasil_estados.geojson base_brasil.pmtiles; do
            if [ ! -f "front/geo/$f" ]; then echo "::error::falta front/geo/$f"; exit 1; fi
          done

      # o mesmo script do CI de todo PR (lá sem os dados): npm ci, build do painel e da ficha, e a pasta site/
      - name: Montar o site (painel com os dados e ficha do produtor)
        env:
          # Variável vazia mantém o Pages de projeto. Um hostname publica / e grava site/CNAME.
          RAIZ_DOMINIO: ${{ vars.RAIZ_DOMINIO }}
        run: front/scripts/construir-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - id: publicar
        uses: actions/deploy-pages@v4
