name: Restrições nacionais (coleta semanal)

# Coleta sozinha, sem download manual: SIGMINE (ANM), autos de infração do Ibama e Lista Suja do trabalho escravo
# (MTE). Nome, CPF e CNPJ não saem da coleta: a Lista Suja vira só vínculo geográfico (auto ou embargo do infrator
# listado) e contagem por município. Publica no Release "insumos" (a tarefa "restricoes" do executor lê):
#   restricoes_sigmine.parquet, restricoes_ibama_autos.parquet, restricoes_lista_suja_vinculos.parquet,
#   restricoes_lista_suja_municipios.csv e restricoes_cobertura.json
# Município pronto não refaz o funil: só a tarefa "restricoes" muda de versão quando a coleta muda
# (raiz/restricoes/status.py). RL e APP declaradas no CAR ficam pendentes (base do SICAR atrás de captcha; LAI).
# Para pausar: desative este workflow na aba Actions.

on:
  schedule:
    - cron: "41 8 * * 3" # quartas, 05h41 em Brasília
  workflow_dispatch:
    inputs:
      fontes:
        description: "fontes por vírgula (sigmine, ibama_autos, lista_suja, car_temas)"
        required: false
        default: "sigmine,ibama_autos,lista_suja,car_temas"
      ufs:
        description: "SIGMINE só destas UFs (teste); vazio = todas"
        required: false
        default: ""
      publicar:
        description: "publicar no Release insumos"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: coletar-restricoes
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      FONTES: ${{ inputs.fontes || 'sigmine,ibama_autos,lista_suja,car_temas' }}
      UFS: ${{ inputs.ufs }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - name: Instalar dependências
        run: |
          uv sync --frozen
          echo "SAIDA=$RUNNER_TEMP/restricoes" >> "$GITHUB_ENV"

      - name: Coletar as fontes nacionais
        run: |
          args=(--saida "$SAIDA" --fontes "$FONTES")
          if [ -n "$UFS" ]; then args+=(--ufs "$UFS"); fi
          uv run raiz restricoes coletar "${args[@]}"

      - name: Conferir antes de publicar
        run: |
          uv run python - <<'PY'
          import json, os, sys
          m = json.load(open(os.environ["SAIDA"] + "/restricoes_cobertura.json", encoding="utf-8"))
          for nome, c in m["fontes"].items():
              print(" ", nome, c["estado"], {k: v for k, v in c.items() if k in ("n", "vinculos", "ufs_falharam")})
          if not any(c["estado"] in ("consultado", "parcial") for c in m["fontes"].values()):
              print("::error::nenhuma fonte cobriu: não publico (o Release mantém a coleta anterior)")
              sys.exit(1)
          PY
          # guarda de privacidade: nenhum CPF ou CNPJ nos arquivos que vão ao Release
          uv run python -c "import os, sys; from raiz.restricoes.coleta import conferir_sem_documento as c; r = c(os.environ['SAIDA']); print(len(r), 'achados'); sys.exit(1 if r else 0)"

      - name: Publicar no Release insumos
        if: github.event_name == 'schedule' || inputs.publicar
        run: |
          if ! gh release view insumos -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create insumos -R "$GITHUB_REPOSITORY" --title "insumos" \
              --notes "Insumos opcionais do processamento (ver motor/README.md e docs/lote.md)."
          fi
          # só sobe o que foi coletado agora; a fonte que falhou mantém o arquivo anterior no Release
          mapfile -t arquivos < <(find "$SAIDA" -maxdepth 1 -type f -name 'restricoes_*' | sort)
          gh release upload insumos "${arquivos[@]}" -R "$GITHUB_REPOSITORY" --clobber
          echo "publicado: ${arquivos[*]}"
