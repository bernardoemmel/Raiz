name: Retomar lote do Pará no arquivo privado

on:
  workflow_dispatch:
    inputs:
      retomar_execucao:
        description: Execução original interrompida (somente 43285608189)
        required: true
        default: "43285608189"
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: lote-para-central-r11
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  SHA_ORIGEM: 31990520b842fd665152b2c7931b3556a66ca180
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

# A operação dispara somente quando há vaga para os cinco jobs, sem cancelar estados em execução.
# Entradas, checkpoints e resultados completos ficam exclusivamente no Release DRAFT dados-privados.
# Nenhum upload-artifact ou cache/save recebe dados desta retomada.
jobs:
  preparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      matriz: ${{ steps.plano.outputs.matriz }}
      plano: ${{ steps.plano.outputs.plano }}
      plano_sha256: ${{ steps.plano.outputs.plano_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Motor e amostra congelados na versão original
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA_ORIGEM }}
          path: motor-origem
      - name: Copiar somente o orquestrador privado para o checkout original
        run: cp raiz/restauracao_retomada.py motor-origem/raiz/restauracao_retomada.py
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Dependências do lockfile original
        working-directory: motor-origem
        run: uv sync --frozen --extra motor
      - name: Validar origem e preservar as entradas e dez fatias no rascunho privado
        id: plano
        working-directory: motor-origem
        env:
          EXECUCAO_ORIGEM: ${{ inputs.retomar_execucao }}
        run: >-
          uv run python -m raiz.restauracao_retomada preparar
          --destino "$GITHUB_WORKSPACE/rodada/preparo" --repo "$GITHUB_REPOSITORY"
          --retomar-execucao "$EXECUCAO_ORIGEM"

  calcular:
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.preparar.outputs.matriz) }}
    env:
      PLANO: ${{ needs.preparar.outputs.plano }}
      PLANO_SHA256: ${{ needs.preparar.outputs.plano_sha256 }}
      FATIA: ${{ matrix.fatia }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA_ORIGEM }}
          path: motor-origem
      - run: cp raiz/restauracao_retomada.py motor-origem/raiz/restauracao_retomada.py
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - working-directory: motor-origem
        run: uv sync --frozen --extra motor
      - name: Ler apenas as entradas congeladas preservadas no arquivo privado
        working-directory: motor-origem
        run: >-
          uv run python -m raiz.restauracao_retomada baixar
          --destino "$GITHUB_WORKSPACE/rodada" --repo "$GITHUB_REPOSITORY"
          --plano "$PLANO" --plano-sha256 "$PLANO_SHA256"
      - name: Confirmar privacidade imediatamente antes de recuperar o checkpoint antigo
        working-directory: motor-origem
        run: uv run python -m raiz.restauracao_retomada verificar --repo "$GITHUB_REPOSITORY"
      - name: Restaurar somente o cache existente da execução original
        uses: actions/cache/restore@v4
        with:
          path: rodada/fatia/resultado
          key: lote-pa-31990520b842fd665152b2c7931b3556a66ca180-43285608189-${{ matrix.fatia }}
      - name: Concluir somente a fatia interrompida e preservar seu resultado privado
        working-directory: motor-origem
        run: >-
          uv run python -m raiz.restauracao_retomada calcular
          --destino "$GITHUB_WORKSPACE/rodada" --repo "$GITHUB_REPOSITORY"
          --plano "$PLANO" --plano-sha256 "$PLANO_SHA256" --fatia "$FATIA"
      - name: Guardar progresso exclusivamente no rascunho privado
        if: always()
        working-directory: motor-origem
        run: >-
          uv run python -m raiz.restauracao_retomada checkpoint
          --destino "$GITHUB_WORKSPACE/rodada" --repo "$GITHUB_REPOSITORY" --fatia "$FATIA"

  publicar:
    needs: [preparar, calcular]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PLANO: ${{ needs.preparar.outputs.plano }}
      PLANO_SHA256: ${{ needs.preparar.outputs.plano_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA_ORIGEM }}
          path: motor-origem
      - run: cp raiz/restauracao_retomada.py motor-origem/raiz/restauracao_retomada.py
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - working-directory: motor-origem
        run: uv sync --frozen --extra motor
      - name: Conferir 144 municípios e publicar três lotes somente no rascunho privado
        working-directory: motor-origem
        run: >-
          uv run python -m raiz.restauracao_retomada publicar
          --destino "$GITHUB_WORKSPACE/rodada" --repo "$GITHUB_REPOSITORY"
          --plano "$PLANO" --plano-sha256 "$PLANO_SHA256"
