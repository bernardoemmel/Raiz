# Conferidor de etapas (docs/conferidor-workflows.md): quando um workflow crítico termina na main,
# abre/atualiza UMA issue por workflow na falha e fecha quando volta a passar; grava o evento em
# registro/falhas-workflows.jsonl na branch registro-workflows. Não toca nos workflows conferidos.
name: Conferidor de etapas

on:
  workflow_run:
    workflows:
      - "Processar estados (motor)"
      - "Terra comprometida (coleta diária dos limites públicos)"
      - "Publicar o site"
    types: [completed]
    branches: [main]

permissions:
  contents: write # só a branch registro-workflows (a main é protegida)
  issues: write
  actions: read

jobs:
  conferir:
    if: contains(fromJSON('["success","failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # workflow_run nunca executa código do evento que o acionou
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar httpx
        run: python -m pip install --quiet "httpx>=0.27"
      - name: Conferir e avisar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m raiz.operacao.conferidor_workflows
