name: Publicar metadados do Release
run-name: Metadados dos dados publicados (${{ inputs.somente_globais && 'somente arquivos globais' || inputs.ufs || 'todos os estados' }})

on:
  workflow_run:
    workflows: ["Processar estados (motor)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ufs:
        description: "UFs para retomar, separadas por espaço. Vazio: todos os pacotes já publicados."
        required: false
        default: ""
      somente_globais:
        description: "Retomar só os arquivos globais, sem reprocessar UFs. Não combinar com UFs específicas."
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  catalogo:
    # Preenchimento único após o término natural da rodada pré-publicador.
    # O checkout padrão usa a main atual, nunca o código/artefatos do gatilho.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       format('{0}', github.event.workflow_run.id) == '43305564503' &&
       github.event.workflow_run.head_sha == '88860b64ee09f811b66e283f5c57997ebcdb3fd5' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      RAIZ_REPO: ${{ github.repository }}
      RAIZ_DADOS_PRIVADOS_URL: ${{ vars.RAIZ_DADOS_PRIVADOS_URL || format('release-github://{0}/dados-privados', github.repository) }}
      RAIZ_DADOS_PRIVADOS_TOKEN: ${{ secrets.RAIZ_DADOS_PRIVADOS_TOKEN || github.token }}
      RAIZ_SEM_BANCO: "1"
      RAIZ_WORKFLOW: processar-estados.yml
      RAIZ_CATALOGO_UFS: ${{ inputs.ufs }}
      RAIZ_CATALOGO_SOMENTE_GLOBAIS: ${{ inputs.somente_globais }}
      # Data de cenário, não data de implantação/contrato de um projeto real.
      RAIZ_CADT_INICIO_CENARIO: ${{ vars.RAIZ_CADT_INICIO_CENARIO || '2027-01-01' }}
    steps:
      - uses: actions/checkout@v4
      - name: Reservar uma das 15 vagas globais antes de qualquer processamento pesado
        run: python scripts/publicar_metadados.py --reservar
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Dependências dos metadados e do produto
        run: uv sync --frozen --all-extras
      - name: Completar fichas, quantis, cartão e cronogramas dos arquivos já publicados
        run: uv run --all-extras python scripts/publicar_metadados.py --publicar --limite-minutos 280
      - name: Conferir listas separadas dos bytes públicos e privados
        id: atestar
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/atestar.txt"; then echo "publico=1" >> "$GITHUB_OUTPUT"; fi
          if test -s "$RUNNER_TEMP/atestar-privado.txt"; then
            python3 scripts/conferir_atestacao_privada.py "$RUNNER_TEMP/atestar-privado.txt"
            echo "privado=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Atestar os arquivos básicos públicos
        if: always() && steps.atestar.outputs.publico == '1'
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: ${{ runner.temp }}/atestar.txt
          show-summary: false
      # Só hashes, identificadores derivados do conteúdo e proveniência ficam públicos; nunca nomes privados.
      - name: Atestar os hashes dos arquivos completos mantidos privados
        if: always() && steps.atestar.outputs.privado == '1'
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: ${{ runner.temp }}/atestar-privado.txt
          show-summary: false
      - name: Guardar o relatório somente no arquivo privado
        if: always()
        env:
          RODADA: ${{ github.run_id }}
          TENTATIVA: ${{ github.run_attempt }}
        run: |
          if test -f "$RUNNER_TEMP/catalogo-metadados.json"; then
            uv run python -m raiz.executor.transferencia_privada enviar-arquivo --imutavel \
              --nome "catalogo-relatorio-${RODADA}-${TENTATIVA}.json" \
              --caminho "$RUNNER_TEMP/catalogo-metadados.json"
          fi
