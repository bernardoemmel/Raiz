name: Calendário diário da Raíz

on:
  push:
    branches: [main]
    paths:
      - "raiz/calendario/**"
      - ".github/workflows/calendario.yml"
  schedule:
    - cron: "11 9 * * *" # 06h11 em Brasília
  workflow_dispatch:
    inputs:
      fontes:
        description: "IDs de fontes; vazio consulta nacionais e diários dos estados processados"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: calendario-diario
  cancel-in-progress: false

jobs:
  coletar:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          version: "0.13.6"
      - name: Dependências
        run: uv sync --frozen
      - name: Leitura de PDFs e OCR dos documentos escaneados
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-por
      - name: Recuperar o estado anterior
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from raiz.calendario.arquivos import recuperar_publico

          total = recuperar_publico(Path('dados/calendario/estado.json'))
          print(f'{total} eventos históricos recuperados e validados.')
          PY
      - name: Conferir a cobertura pública dos estados
        if: inputs.fontes == ''
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from raiz.calendario.catalogo import carregar_manifesto

          # A cobertura já é pública. Usa o mesmo leitor limitado e validado do CLI,
          # sem depender da descoberta do Release pela API autenticada do GitHub.
          dados = carregar_manifesto()
          Path('dados/calendario/estados.json').write_text(
              json.dumps(dados, ensure_ascii=False), encoding='utf-8'
          )
          PY
      - name: Coleta das fontes oficiais
        id: coleta
        env:
          FONTES: ${{ inputs.fontes }}
        run: |
          args=(coletar --sem-banco --saida dados/calendario)
          [ ! -f dados/calendario/estado.json ] || args+=(--anterior dados/calendario/estado.json)
          if [ -n "$FONTES" ]; then
            args+=(--fontes "$FONTES")
          else
            args+=(--manifesto-estados dados/calendario/estados.json)
          fi
          uv run raiz calendario "${args[@]}"
      - name: Validar estado, eventos e feed antes de publicar
        id: validar
        if: always() && steps.coleta.outputs.gerado == '1'
        run: uv run --frozen python -m raiz.qualidade_calendario --pasta dados/calendario
      - name: Publicar o que foi coletado, mesmo com uma fonte indisponível
        if: always() && steps.validar.outcome == 'success'
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from raiz.calendario.publicacao import publicar_release

          publicar_release(Path('dados/calendario'), os.environ['GITHUB_REPOSITORY'], os.environ['GH_TOKEN'])
          print('Três arquivos públicos conferidos e publicados; histórico anterior preservado até a promoção.')
          PY
      - name: Resumo da cobertura
        if: always() && steps.validar.outcome == 'success'
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d = json.loads(Path('dados/calendario/eventos.json').read_text())
          print(f"Calendário: {d['total']} eventos. Envio de avisos externos permanece simulado.\n")
          print('| Fonte | Situação | Eventos |\n|---|---|---|')
          for f in d['fontes']:
              print(f"| {f['nome']} | {f['situacao']} | {f['eventos']} |")
          PY
