name: Calendário diário da Raíz
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendario-diario
  cancel-in-progress: false
jobs:
  restaurar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar coleta pública validada
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/calendario" --jq 'select(.draft == false and .tag_name == "calendario") | .id' > /tmp/release-id
          test -s /tmp/release-id
          gh release upload calendario -R "$GITHUB_REPOSITORY" operacao-calendario-publico/estado.json operacao-calendario-publico/eventos.json operacao-calendario-publico/eventos.ics --clobber
