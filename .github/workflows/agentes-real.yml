name: Agente real semanal

on:
  schedule:
    - cron: "0 9 * * 1" # segunda-feira, 06h em America/Sao_Paulo (UTC-3)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentes-real
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Exigir a credencial do agente real
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Configure o segredo ANTHROPIC_API_KEY no repositório. A medição real não foi executada."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Dependências travadas
        run: uv sync --frozen
      - name: Subir pilha sintética isolada
        run: uv run python scripts/pilha_agentes.py teste --env-file .env.agentes-teste
      - name: Claude por MCP, 24 tarefas em quatro sessões independentes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          uv run python scripts/avaliar_agente_real.py
          --provider scripts.cenarios_agentes:provedor
          --modelo claude-sonnet-5-5 --modo real
          --cassetes .cache/agentes-real/cassetes --saida .cache/agentes-real
          --campanha semanal-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Medir memória e disco após a campanha
        if: always()
        run: >-
          uv run python scripts/pilha_agentes.py medir --teste --env-file .env.agentes-teste
          --saida .cache/agentes-real/recursos.json --amostras 5 --intervalo 2
      - name: Guardar somente o relatório técnico como artefato do workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medicao-agente-real
          path: |
            .cache/agentes-real/relatorio.json
            .cache/agentes-real/recursos.json
          retention-days: 30
          if-no-files-found: error
      - name: Encerrar a pilha local
        if: always()
        run: uv run python scripts/pilha_agentes.py parar --teste --env-file .env.agentes-teste
