name: Processar estados (motor)
run-name: Diagnóstico somente de leitura do acesso privado e da cota
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAIZ_TOKEN: ${{ secrets.RAIZ_DADOS_PRIVADOS_TOKEN || github.token }}
      RAIZ_REPO: ${{ github.repository }}
    steps:
      - name: Conferir status e cota sem publicar dados nem valores de credenciais
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          repo = os.environ['RAIZ_REPO']
          for recurso in ('rate_limit', f'repos/{repo}'):
              req = urllib.request.Request(
                  'https://api.github.com/' + recurso,
                  headers={'Authorization': 'Bearer ' + os.environ['RAIZ_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'User-Agent': 'Raiz-diagnostico'},
                  method='GET',
              )
              try:
                  resposta = urllib.request.urlopen(req, timeout=30)
              except urllib.error.HTTPError as erro:
                  resposta = erro
              resumo = {'recurso': 'cota' if recurso == 'rate_limit' else 'repositorio',
                        'status': resposta.status}
              for nome in ('X-RateLimit-Limit', 'X-RateLimit-Remaining', 'X-RateLimit-Reset', 'Retry-After'):
                  valor = resposta.headers.get(nome, '')
                  if valor.isdigit(): resumo[nome.lower()] = int(valor)
              if recurso == 'rate_limit' and resposta.status == 200:
                  core = json.load(resposta).get('resources', {}).get('core', {})
                  resumo['core'] = {k: core[k] for k in ('limit', 'remaining', 'reset', 'used')
                                    if type(core.get(k)) is int}
              resposta.close()
              print(json.dumps(resumo), flush=True)
