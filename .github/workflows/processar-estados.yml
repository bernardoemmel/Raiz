name: Processar estados (motor)
run-name: Diagnóstico somente de leitura do acesso privado e da cota
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAIZ_TOKEN: ${{ secrets.RAIZ_DADOS_PRIVADOS_TOKEN || github.token }}
      RAIZ_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Diagnosticar o mesmo cliente usado pelo executor, somente GET
        env:
          PYTHONPATH: .
        run: |
          uv run --no-project --with httpx==0.28.1 python - <<'PYTHON'
          import json, os, tempfile
          from pathlib import Path
          from raiz.executor.armazem import ArmazemRelease
          arm = ArmazemRelease(os.environ['RAIZ_REPO'], 'dados-privados', espelho=Path(tempfile.mkdtemp(prefix='raiz-diagnostico-')), token=os.environ['RAIZ_TOKEN'], privado=True)
          def observar(resposta):
              resumo = {'cliente': 'executor', 'status': resposta.status_code}
              caminho = resposta.request.url.path
              resumo['recurso'] = 'tag' if '/releases/tags/' in caminho else ('releases' if '/releases' in caminho else 'repositorio')
              for nome in ('x-ratelimit-limit', 'x-ratelimit-remaining', 'x-ratelimit-reset', 'retry-after'):
                  valor = resposta.headers.get(nome, '')
                  if valor.isdigit(): resumo[nome] = int(valor)
              if resposta.status_code >= 400:
                  resposta.read()
                  try: mensagem = resposta.json().get('message', '').lower()
                  except Exception: mensagem = ''
                  resumo['categoria'] = ('cota' if 'rate limit' in mensagem else
                                         'permissao' if 'resource not accessible' in mensagem else
                                         'credencial' if 'bad credentials' in mensagem else 'outra')
              print(json.dumps(resumo), flush=True)
          arm.cli.event_hooks['response'].append(observar)
          try:
              rel = arm._exigir_privado()
              print(json.dumps({'arquivo_privado_confirmado': bool(rel.get('draft'))}))
          except Exception as ex:
              print(json.dumps({'falha': type(ex).__name__}))
          finally: arm.cli.close()
          PYTHON
      - name: Conferir status e cota sem publicar dados nem valores de credenciais
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          repo = os.environ['RAIZ_REPO']
          for recurso in ('rate_limit', f'repos/{repo}'):
              req = urllib.request.Request(
                  'https://api.github.com/' + recurso,
                  headers={'Authorization': 'Bearer ' + os.environ['RAIZ_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'User-Agent': 'Raiz-diagnostico'},
                  method='GET',
              )
              try:
                  resposta = urllib.request.urlopen(req, timeout=30)
              except urllib.error.HTTPError as erro:
                  resposta = erro
              resumo = {'recurso': 'cota' if recurso == 'rate_limit' else 'repositorio',
                        'status': resposta.status}
              for nome in ('X-RateLimit-Limit', 'X-RateLimit-Remaining', 'X-RateLimit-Reset', 'Retry-After'):
                  valor = resposta.headers.get(nome, '')
                  if valor.isdigit(): resumo[nome.lower()] = int(valor)
              if recurso == 'rate_limit' and resposta.status == 200:
                  core = json.load(resposta).get('resources', {}).get('core', {})
                  resumo['core'] = {k: core[k] for k in ('limit', 'remaining', 'reset', 'used')
                                    if type(core.get(k)) is int}
              resposta.close()
              print(json.dumps(resumo), flush=True)
