# Fluxo antigo (pelo git), para quem rodou o motor no computador: publica no Release `dados` os pacotes que
# motor/publicar_dados.py gravou em dados-entrada/. Depois de publicar, dados-entrada/ sai do branch (os dados grandes
# ficam só no Release, nunca no main). O caminho normal agora é o processar-estados.yml, que roda e publica sozinho.
# O estados.json não é sobrescrito: só as entradas dos estados que têm pacote aqui são mescladas no publicado, dentro
# da mesma trava que o processar-estados.yml usa (motor/publicar_dados.py --indice).
name: Publicar dados do motor

on:
  push:
    paths:
      - "dados-entrada/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-dados
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver se há pacotes para publicar
        id: tem
        run: |
          if [ -n "$(ls -A dados-entrada 2>/dev/null)" ]; then echo "sim=1" >> "$GITHUB_OUTPUT"; else echo "Nada em dados-entrada/, nada a publicar."; fi

      - if: steps.tem.outputs.sim == '1'
        name: Juntar as partes dos pacotes grandes
        run: |
          cd dados-entrada
          for p in *.part00; do
            [ -e "$p" ] || continue
            nome="${p%.part00}"
            cat "$nome".part* > "$nome"
            rm "$nome".part*
          done
          ls -la

      - if: steps.tem.outputs.sim == '1'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - if: steps.tem.outputs.sim == '1'
        name: Validar todos os arquivos antes de publicar qualquer pacote
        run: |
          uv sync --frozen
          uv run python -m raiz.qualidade_dados dados-entrada

      - if: steps.tem.outputs.sim == '1'
        name: Criar o Release dados se não existir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dados >/dev/null 2>&1 || gh release create dados \
            --prerelease --target main \
            --title "Dados do motor (atualizado sozinho)" \
            --notes "Saídas do motor por estado, só de fontes públicas, sem nome, CPF ou CNPJ. O front baixa sozinho com front/scripts/baixar-dados.mjs. Não editar à mão."

      - if: steps.tem.outputs.sim == '1'
        name: Subir os pacotes (estados.json por último, mesclado no publicado)
        env:
          GH_TOKEN: ${{ github.token }}
          RAIZ_REPO: ${{ github.repository }}
        run: |
          cd dados-entrada
          for f in *.tar.gz *.kml *.geojson; do
            [ -e "$f" ] || continue
            gh release upload dados "$f" --clobber
          done
          cd ..
          [ -e dados-entrada/estados.json ] && uv run python motor/publicar_dados.py --indice dados-entrada
          echo "Publicado:"; gh release view dados --json assets --jq '.assets[] | "\(.name) \(.size)"'
