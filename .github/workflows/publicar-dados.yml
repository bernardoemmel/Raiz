# Fluxo antigo (pelo git), para quem rodou o motor no computador: publica no Release `dados` os pacotes que
# motor/publicar_dados.py gravou em dados-entrada/. Depois de publicar, dados-entrada/ sai do branch (os dados grandes
# ficam só no Release, nunca no main). O caminho normal agora é o processar-estados.yml, que roda e publica sozinho.
# O estados.json não é sobrescrito: só as entradas dos estados que têm pacote aqui são mescladas no publicado, dentro
# da mesma trava que o processar-estados.yml usa (motor/publicar_dados.py --indice).
name: Publicar dados do motor

on:
  push:
    paths:
      - "dados-entrada/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-dados
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RAIZ_ARMAZEM_URL: release-github://${{ github.repository }}/dados
      RAIZ_DADOS_PRIVADOS_URL: ${{ vars.RAIZ_DADOS_PRIVADOS_URL || format('release-github://{0}/dados-privados', github.repository) }}
      RAIZ_DADOS_PRIVADOS_TOKEN: ${{ secrets.RAIZ_DADOS_PRIVADOS_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dependências do publicador e da validação geográfica
        run: uv sync --frozen --all-extras

      - name: Ver se há pacotes para publicar
        id: tem
        run: |
          if [ -n "$(ls -A dados-entrada 2>/dev/null)" ]; then echo "sim=1" >> "$GITHUB_OUTPUT"; else echo "Nada em dados-entrada/, nada a publicar."; fi

      - if: steps.tem.outputs.sim == '1'
        name: Juntar as partes dos pacotes grandes
        run: |
          cd dados-entrada
          for p in *.part00; do
            [ -e "$p" ] || continue
            nome="${p%.part00}"
            cat "$nome".part* > "$nome"
            rm "$nome".part*
          done
          ls -la

      - if: steps.tem.outputs.sim == '1'
        name: Arquivar os pacotes completos e publicar somente a projeção validada
        run: uv run python -m raiz.executor.publicar_entrada dados-entrada
