name: Medição de agentes (24 tarefas)

on:
  workflow_dispatch:
    inputs:
      modelo:
        description: ID exato do modelo Anthropic (sem alias móvel)
        required: true
        default: claude-sonnet-5-5
        type: string
      juiz:
        description: ID exato do juiz independente (vazio usa o mesmo modelo, em sessão separada)
        required: false
        type: string
  schedule:
    - cron: '0 9 * * 1' # segunda, 06:00 em Brasília

permissions:
  contents: read

concurrency:
  group: medicao-agentes
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MODELO: ${{ inputs.modelo || vars.RAIZ_AVALIACAO_MODELO || 'claude-sonnet-5-5' }}
      JUIZ: ${{ inputs.juiz || vars.RAIZ_AVALIACAO_JUIZ || inputs.modelo || vars.RAIZ_AVALIACAO_MODELO || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/globo/package-lock.json
      - name: Preparar relatório inicial (mesmo se a pilha falhar)
        run: |
          mkdir -p .cache/avaliacao-agentes/publico
          python - <<'PY'
          import json
          from pathlib import Path
          Path('.cache/avaliacao-agentes/publico/relatorio.json').write_text(json.dumps({
              'aprovado': False, 'estado': 'incompleta', 'motivo': 'preparacao_da_pilha',
              'tarefas': 24, 'tentativas_planejadas': 96, 'tentativas_concluidas': 0,
              'pass4': None, 'passos': 0, 'segundos': 0, 'chamadas_proibidas': 0,
          }, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Dependências travadas
        run: |
          uv sync --frozen --all-extras
          npm --prefix front/globo ci --no-audit --no-fund
          cd front/globo
          npx playwright install --with-deps chromium
      - name: Subir PostGIS, Valkey e Keycloak descartáveis
        run: docker compose -f infra/docker-compose.avaliacao.yml up -d --wait --wait-timeout 180
      - name: Conferir OAuth, MCP, worker, saldo, limites e idempotência sem modelo
        run: uv run python -m scripts.verificar_pilha_avaliacao
      - name: Rodar 24 tarefas em quatro sessões novas cada
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m scripts.medir_agentes --modelo "$MODELO" --juiz "$JUIZ"
      - name: Resumo da campanha
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('.cache/avaliacao-agentes/publico/relatorio.json')
          if p.exists():
              r = json.loads(p.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('## Medição de agentes\n\n')
                  for k in ('estado', 'motivo', 'tentativas_concluidas', 'tentativas_planejadas',
                            'pass4', 'passos', 'segundos', 'chamadas_proibidas', 'aprovado'):
                      out.write(f'- {k}: `{r.get(k)}`\n')
          PY
      - name: Publicar relatório e métricas sem textos, dados privados ou credenciais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medicao-agentes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/avaliacao-agentes/publico/relatorio.json
            .cache/avaliacao-agentes/publico/metricas.json
            .cache/avaliacao-agentes/publico/execucoes.jsonl
          retention-days: 30
          # A lista acima é fechada; .cache é oculto e não deve impedir o relatório.
          include-hidden-files: true
          if-no-files-found: error
      - name: Remover pilha e volumes temporários
        if: always()
        run: docker compose -f infra/docker-compose.avaliacao.yml down --volumes --remove-orphans
