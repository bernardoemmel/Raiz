# Vigilância diária dos lotes ativos (docs/vigilancia-lotes.md).
# Lê DETER, MapBiomas Alerta e FIRMS (NOAA-20/21) e cruza somente CARs do catálogo privado de pedidos.
# Alertas ficam no arquivo autenticado e rascunhos por dono também cifrados (RAIZ_VIGILANCIA_CHAVE).
# Fonte com erro/credencial ausente ou cobertura parcial deixa a execução vermelha após guardar o resultado útil.
#
# Segredos do repositório (Settings > Secrets and variables > Actions):
#   MAPBIOMAS_ALERTA_EMAIL, MAPBIOMAS_ALERTA_SENHA   conta da Plataforma MapBiomas Alerta
#   RAIZ_VIGILANCIA_CHAVE                             chave Fernet (python -m raiz.vigilancia chave)
#   RAIZ_BANCO_URL                                   (opcional) banco; sem ele, usa snapshot privado renovado pelo servidor
#   FIRMS_MAP_KEY                                     (opcional) chave da API do FIRMS
name: Vigilância diária

on:
  schedule:
    - cron: "17 9 * * *" # 06:17 em Brasília, todo dia
  workflow_dispatch:
    inputs:
      fontes:
        description: "Só estas fontes (vírgula): mapbiomas_alerta, firms, ibama_embargo, deter, prodes"
        required: false
        default: ""
      ufs:
        description: "Só estas UFs do arquivo privado processado (vírgula)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Pastas do estado e do cache (fora do repositório)
        run: |
          echo "RAIZ_VIGILANCIA_DIR=$RUNNER_TEMP/vigilancia/estado" >> "$GITHUB_ENV"
          echo "RAIZ_VIGILANCIA_CACHE=$RUNNER_TEMP/vigilancia/cache" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: raiz/vigilancia/requisitos.txt

      - name: Dependências
        run: pip install -r raiz/vigilancia/requisitos.txt

      - name: Testes da vigilância
        run: python -m pytest -q raiz/vigilancia/testes

      # Cache local descartável: polígonos com atributos e embargos não saem pelo cache aberto do Actions.
      # Estado, alertas e retomadas são lidos e gravados no arquivo privado autenticado.
      - name: Rodada
        env:
          MAPBIOMAS_ALERTA_EMAIL: ${{ secrets.MAPBIOMAS_ALERTA_EMAIL }}
          MAPBIOMAS_ALERTA_SENHA: ${{ secrets.MAPBIOMAS_ALERTA_SENHA }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          RAIZ_VIGILANCIA_CHAVE: ${{ secrets.RAIZ_VIGILANCIA_CHAVE }}
          RAIZ_PROJETOS_PRIVADO: ${{ secrets.RAIZ_PROJETOS_PRIVADO }}
          RAIZ_BANCO_URL: ${{ secrets.RAIZ_BANCO_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          RAIZ_DADOS_PRIVADOS_URL: ${{ vars.RAIZ_DADOS_PRIVADOS_URL || format('release-github://{0}/dados-privados', github.repository) }}
          RAIZ_DADOS_PRIVADOS_TOKEN: ${{ secrets.RAIZ_DADOS_PRIVADOS_TOKEN || github.token }}
          FONTES: ${{ inputs.fontes }}
          UFS: ${{ inputs.ufs }}
        run: |
          args=(rodar --lotes --baixar --publicar --resumo "$GITHUB_STEP_SUMMARY")
          args+=(--fontes "${FONTES:-deter,mapbiomas_alerta,firms}")
          [ -n "$UFS" ] && args+=(--ufs "$UFS")
          python -m raiz.vigilancia "${args[@]}"
