name: Fontes complementares (coleta semanal)

# Coleta sozinha, sem download manual: crédito rural do Banco Central (SICOR: operações, vínculo com o CAR e glebas),
# localidades quilombolas do Censo 2022 (IBGE) e comunidades certificadas pela Fundação Palmares. CPF, CNPJ, nomes e
# valores em reais não saem da coleta. Publica no Release "insumos" (a tarefa "complementares" do executor lê):
#   complementares_sicor_car.parquet, complementares_sicor_glebas_<UF>.parquet,
#   complementares_ibge_quilombolas.parquet, complementares_palmares_municipios.csv e complementares_cobertura.json
# Fontes que dependem de autorização (MPF, Observatório da Restauração, Restor): rodar este workflow à mão com
# "importar_fonte", o link do arquivo recebido e a descrição da autorização. Detalhes: docs/fontes-complementares.md.
# Município pronto não refaz o funil: só a tarefa "complementares" muda de versão quando a coleta muda.
# Para pausar: desative este workflow na aba Actions.

on:
  schedule:
    - cron: "17 9 * * 4" # quintas, 06h17 em Brasília (o BCB atualiza o SICOR aos domingos)
  workflow_dispatch:
    inputs:
      fontes:
        description: "fontes abertas por vírgula (sicor, ibge_quilombolas, palmares)"
        required: false
        default: "sicor,ibge_quilombolas,palmares"
      importar_fonte:
        description: "importar arquivo recebido: mpf_territorios, observatorio ou restor (vazio = não importa)"
        required: false
        default: ""
      importar_url:
        description: "link direto do arquivo (zip do shapefile, GeoPackage ou GeoJSON)"
        required: false
        default: ""
      autorizacao:
        description: "quem autorizou, quando e por qual meio (obrigatório para importar)"
        required: false
        default: ""
      licenca:
        description: "licença ou condição de uso informada pela fonte"
        required: false
        default: ""
      publicar:
        description: "publicar no Release insumos"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: coletar-complementares
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      FONTES: ${{ inputs.fontes || 'sicor,ibge_quilombolas,palmares' }}
      IMPORTAR_FONTE: ${{ inputs.importar_fonte }}
      IMPORTAR_URL: ${{ inputs.importar_url }}
      AUTORIZACAO: ${{ inputs.autorizacao }}
      LICENCA: ${{ inputs.licenca }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - name: Instalar dependências
        run: |
          uv sync --frozen
          echo "SAIDA=$RUNNER_TEMP/complementares" >> "$GITHUB_ENV"

      - name: Trazer as fontes importadas antes (para não perdê-las)
        run: |
          mkdir -p "$SAIDA"
          gh release download insumos -R "$GITHUB_REPOSITORY" -D "$SAIDA" --clobber \
            -p 'complementares_*_meta.json' -p 'complementares_mpf_territorios.parquet' \
            -p 'complementares_restauracao_*' 2>/dev/null || echo "nenhuma fonte importada ainda"

      - name: Importar arquivo recebido com autorização
        if: env.IMPORTAR_FONTE != ''
        run: |
          if [ -z "$IMPORTAR_URL" ] || [ -z "$AUTORIZACAO" ]; then
            echo "::error::para importar, informe o link do arquivo e a autorização"; exit 1
          fi
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/recebido" "$IMPORTAR_URL"
          tipo=$(file -b --mime-type "$RUNNER_TEMP/recebido")
          case "$tipo" in
            application/zip) ext=zip ;;
            application/geo+json|application/json|text/plain) ext=geojson ;;
            application/vnd.sqlite3|application/x-sqlite3) ext=gpkg ;;
            *) ext=zip ;;
          esac
          mv "$RUNNER_TEMP/recebido" "$RUNNER_TEMP/recebido.$ext"
          uv run raiz complementares importar "$RUNNER_TEMP/recebido.$ext" --fonte "$IMPORTAR_FONTE" \
            --saida "$SAIDA" --autorizacao "$AUTORIZACAO" --licenca "$LICENCA"

      - name: Coletar as fontes abertas
        run: uv run raiz complementares coletar --saida "$SAIDA" --fontes "$FONTES"

      - name: Conferir antes de publicar
        run: |
          uv run python - <<'PY'
          import json, os, sys
          m = json.load(open(os.environ["SAIDA"] + "/complementares_cobertura.json", encoding="utf-8"))
          for nome, c in m["fontes"].items():
              print(" ", nome, c["estado"], {k: v for k, v in c.items() if k in ("n", "car_vinculados", "glebas")})
          if not any(c["estado"] in ("consultado", "parcial") for c in m["fontes"].values()):
              print("::error::nenhuma fonte cobriu: não publico (o Release mantém a coleta anterior)")
              sys.exit(1)
          PY
          # guarda de privacidade: nenhum CPF ou CNPJ nos arquivos que vão ao Release
          uv run python -c "import os, sys; from raiz.complementares.coleta import conferir_sem_documento as c; r = c(os.environ['SAIDA']); print(len(r), 'achados'); sys.exit(1 if r else 0)"

      - name: Publicar no Release insumos
        if: github.event_name == 'schedule' || inputs.publicar
        run: |
          if ! gh release view insumos -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create insumos -R "$GITHUB_REPOSITORY" --title "insumos" \
              --notes "Insumos opcionais do processamento (ver motor/README.md e docs/lote.md)."
          fi
          # só sobe o que existe agora; a fonte que falhou mantém o arquivo anterior no Release
          mapfile -t arquivos < <(find "$SAIDA" -maxdepth 1 -type f -name 'complementares_*' | sort)
          gh release upload insumos "${arquivos[@]}" -R "$GITHUB_REPOSITORY" --clobber
          echo "publicado: ${#arquivos[@]} arquivos"
