name: Aliviar o arquivo privado (limite de 1000 arquivos)

# Com 1000 arquivos no Release dados-privados o GitHub recusa todo upload (HTTP 422) e nenhum estado
# publica. A cada hora, move para um Release rascunho historico-AAAA-MM-DD o que o processamento não lê
# mais (relatórios de catálogo, cópias de migração e checkpoints soltos). Nada sai sem cópia conferida.
# Checkpoints ficam num Release próprio (dados-privados-checkpoints), aliviado do mesmo jeito.
# Autorizado pelo fundador em 14/11/2026.
# Agenda de hora em hora removida em 27/11/2026, com o processamento parado.
# Rode à mão se o Release dados-privados chegar perto de 1000 arquivos.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aliviar-dados-privados
  cancel-in-progress: false

jobs:
  aliviar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
      - name: Instalar dependências
        run: uv sync --frozen
      - name: Levar os checkpoints ao Release próprio (dados-privados-checkpoints)
        run: uv run python scripts/aliviar_dados_privados.py --executar --migrar-checkpoints
      - name: Mover arquivos antigos para o histórico
        run: uv run python scripts/aliviar_dados_privados.py --executar
      - name: Mover checkpoints soltos para o histórico
        run: uv run python scripts/aliviar_dados_privados.py --executar --tag dados-privados-checkpoints
