name: Lotes privados por estado, bioma e Brasil

on:
  workflow_dispatch:
    inputs:
      ufs:
        description: "UFs separadas por espaço; vazio atualiza todos os recortes publicados"
        type: string
        default: ""
      bioma:
        description: "Bioma exato, opcional (Amazônia, Caatinga, Cerrado, Mata Atlântica, Pampa, Pantanal)"
        type: string
        default: ""
      brasil:
        description: "Consultar Brasil inteiro na cobertura disponível"
        type: boolean
        default: false
      pedido:
        description: "JSON CamposPedido; vazio usa um milhão de créditos e o cenário padrão vigente"
        type: string
        default: ""
  workflow_run:
    workflows: ["Processar estados (motor)"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 */2 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: lote-nacional-privado
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  RAIZ_DADOS_PRIVADOS_URL: ${{ vars.RAIZ_DADOS_PRIVADOS_URL || format('release-github://{0}/dados-privados', github.repository) }}
  RAIZ_DADOS_PRIVADOS_TOKEN: ${{ secrets.RAIZ_DADOS_PRIVADOS_TOKEN || github.token }}
  # Balde S3 do arquivo privado (docs/armazenamento.md): só vale quando RAIZ_DADOS_PRIVADOS_URL=s3://...
  RAIZ_S3_ENDPOINT: ${{ vars.RAIZ_S3_ENDPOINT }}
  RAIZ_S3_ACCESS_KEY_ID: ${{ secrets.RAIZ_S3_ACCESS_KEY_ID }}
  RAIZ_S3_SECRET_ACCESS_KEY: ${{ secrets.RAIZ_S3_SECRET_ACCESS_KEY }}
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  preparar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # workflow_run nunca executa código do evento que o acionou
      - name: Esperar uma cota na fila global antes dos dados
        run: python scripts/reservar_lote.py --reservar 1 --aguardar-minutos 180
      - name: Liberar SDKs não usados no runner temporário
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv sync --frozen --extra motor
      # Limites da terra já comprometida (coletar-comprometida.yml). Com eles, a rodada refaz comprometida_<mun>.csv
      # que falte ou esteja velho e o lote tira as fazendas já comprometidas; sem eles, tudo fica "não verificada".
      - name: Baixar os limites da terra já comprometida (Release insumos)
        run: |
          mkdir -p "$RUNNER_TEMP/comprometida"
          if gh release download insumos -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/comprometida" --clobber \
               -p comprometida_limites.parquet -p comprometida_cobertura.json; then
            echo "limites da terra já comprometida: ok"
          else
            rm -f "$RUNNER_TEMP"/comprometida/comprometida_*
            echo "::warning::sem limites da terra já comprometida: o lote sai com sobreposição não verificada"
          fi
      - name: Atualizar índices e publicar consultas somente no arquivo privado
        env:
          RAIZ_COMPROMETIDA_DIR: ${{ runner.temp }}/comprometida
          INPUT_UFS: ${{ inputs.ufs }}
          INPUT_BIOMA: ${{ inputs.bioma }}
          INPUT_BRASIL: ${{ inputs.brasil }}
          INPUT_PEDIDO: ${{ inputs.pedido }}
        run: |
          uv run python - <<'PY'
          import os, pathlib, subprocess, sys
          pasta = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lote-nacional'
          pasta.mkdir(mode=0o700, exist_ok=True)
          args = [sys.executable, '-m', 'raiz.restauracao_nacional_rodada',
                  '--trabalho', str(pasta), '--limite-minutos', '120', '--consultar', '--manutencao']
          for uf in os.environ.get('INPUT_UFS', '').split():
              args.extend(['--uf', uf])
          if os.environ.get('INPUT_BIOMA'):
              args.extend(['--bioma', os.environ['INPUT_BIOMA']])
          if os.environ.get('INPUT_BRASIL') == 'true':
              args.append('--brasil')
          if os.environ.get('INPUT_PEDIDO'):
              pedido = pasta / 'pedido.json'
              pedido.write_text(os.environ['INPUT_PEDIDO'])
              pedido.chmod(0o600)
              args.extend(['--pedido', str(pedido)])
          subprocess.run(args, check=True)
          PY
      - name: Conferir o que foi publicado (todas as UFs, biomas e Brasil, com as três opções)
        run: uv run python -m raiz.restauracao_nacional_rodada --conferir
