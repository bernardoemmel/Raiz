# Checagens de todo PR (e da main). Três jobs em paralelo; o PR fica vermelho se qualquer um falhar:
#   workflows  actionlint em .github/workflows: falha se algum workflow não abre (YAML quebrado, chave errada,
#              expressão inválida). Foi assim que o "Publicar o site" chegou quebrado à main sem ninguém ver.
#   front      o mesmo build do site público com dados pequenos de teste, servido como no Pages: instalação
#              travada, compilação, busca, polígonos coloridos, overzoom e zero 404 no Playwright.
#   checagens  Python: estilo, CPF/CNPJ, licenças e testes com PostGIS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # actionlint (MIT) pela imagem oficial; o shellcheck dentro dele fica desligado: o que importa aqui é o
      # workflow abrir e as chaves e expressões estarem certas
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color -shellcheck= -pyflakes=

  front:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar os dados pequenos de teste (sem baixar o Release)
        run: node front/scripts/preparar-teste-site.mjs
      - name: Build do site público com a fixture (npm ci e build do painel e da ficha do produtor)
        env:
          RAIZ_DADOS: front/.cache/teste-site/dados
          RAIZ_GEO: front/.cache/teste-site/geo
          VITE_RAIZ_TESTE_MAPA: "1"
          RAIZ_BASE: /Raiz/
        run: front/scripts/construir-site.sh
      - name: Testes do front
        run: cd front/globo && npm test
      - name: Chromium para o Playwright
        run: cd front/globo && npx playwright install --with-deps chromium
      - name: Pages no navegador (Parauapebas, mapa agregado e zero 404)
        run: cd front/globo && npm run test:pages
      - name: Prospecção no navegador (créditos, contato, sessão e celular)
        env:
          RAIZ_PRINTS: ${{ github.workspace }}/front/.cache/teste-site/resultado/prospeccao
        run: cd front/globo && npm run test:prospeccao
      - name: Evidências do teste do Pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-pages
          path: front/.cache/teste-site/resultado
          if-no-files-found: ignore
      # Reutiliza o Chromium instalado para o teste Playwright do Pages.
      - name: Site para agentes (Markdown, JSON-LD e Lighthouse Agentic Browsing)
        run: cd front/globo && npm run test:agentes
      - name: Relatório da auditoria para agentes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-agentes
          path: front/.cache/teste-agentes
          if-no-files-found: ignore

      - name: Celular, teclado, WCAG 2.1 AA e Lighthouse >= 90
        run: cd front/globo && npm run test:acessibilidade
      - name: Evidências de acessibilidade e desempenho
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celular-acessibilidade
          path: front/.cache/teste-acessibilidade
          if-no-files-found: ignore

  checagens:
    runs-on: ubuntu-24.04
    services:
      banco:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: raiz
          POSTGRES_PASSWORD: raiz
          POSTGRES_DB: raiz_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raiz"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RAIZ_BANCO_URL_TESTE: postgresql+psycopg://raiz:raiz@localhost:5432/raiz_teste
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dependências (produto e motor)
        run: uv sync --frozen --all-extras
      - name: Takumi (cartão e vídeo) e FFmpeg
        run: |
          (cd servicos/cartao && npm ci --no-audit --no-fund)
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Estilo
        run: |
          uv run ruff check raiz testes scripts migracoes
          uv run ruff format --check raiz testes scripts migracoes
      - name: Sem CPF/CNPJ no repositório
        run: uv run raiz privacidade varrer
      - name: Licenças
        run: uv run python scripts/checar_licencas.py
      - name: Testes
        run: uv run pytest -q
