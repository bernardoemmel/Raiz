# Fontes estaduais do Tocantins. Testado em 17/11/2026: *.to.gov.br (NATURATINS, ITERTINS, SEPLAN/geoportal)
# fecha a conexão desta nuvem; o TJTO abre. A coleta automática fica para rodar do Brasil.
uf: TO
verificado_em: "2026-11-17"
fontes:
  - id: to_naturatins_embargos
    nome: Áreas embargadas e autos de infração do NATURATINS
    tema: embargo_estadual
    orgao: NATURATINS
    acesso: bloqueado_fora_brasil
    tipo: pendente
    url: https://www.to.gov.br/naturatins
    efeito: conferir
    motivo: embargo_estadual_a_conferir
    criterio: Embargo estadual acima do limiar = exclusão quando a camada chegar; autos = ressalva; até lá, checklist.
    lgpd: Apagar nome e documento na entrada.
    situacao: {testado_em: "2026-11-17", resultado: "naturatins.to.gov.br e www.to.gov.br: conexão fechada daqui"}
    alternativa: >-
      Embargos e autos do Ibama (nacional). O geoportal da SEPLAN-TO roda GeoServer (gvSIG Online): achar a camada
      no GetCapabilities a partir do Brasil.

  - id: to_itertins_terras
    nome: Terras devolutas e títulos estaduais (ITERTINS)
    tema: terra_devoluta
    orgao: ITERTINS
    acesso: bloqueado_fora_brasil
    tipo: pendente
    url: https://itertins.to.gov.br/
    efeito: conferir
    motivo: terra_devoluta_a_conferir
    criterio: Título ou gleba estadual sobre o imóvel = ressalva; sem camada, checklist (MATOPIBA tocantinense).
    lgpd: —
    situacao: {testado_em: "2026-11-17", resultado: "itertins.to.gov.br: conexão fechada daqui"}
    alternativa: to_glebas_estaduais_cnfp (CNFP 2025), SIGEF nacional e LAI ao ITERTINS.

  - id: to_glebas_estaduais_cnfp
    nome: Florestas públicas estaduais não destinadas (CNFP 2025)
    tema: terra_devoluta
    orgao: SFB (CNFP), com dado do ITERTINS
    acesso: aberto
    tipo: cnfp
    url: https://www.gov.br/florestal/pt-br/assuntos/cadastro-nacional-de-florestas-publicas
    geometria: poligono
    manter: [categoria, tipo, governo, orgao, protecao]
    efeito: ressalva
    motivo: gleba_estadual
    criterio: >-
      Floresta pública estadual não destinada (tipo B, governo estadual) acima do limiar = ressalva: posse em terra
      do estado; o caminho é a regularização no ITERTINS. 
    lgpd: Sem dado pessoal.
    licenca: Dado aberto do governo federal (Decreto 8.777/2016).
    situacao: {testado_em: "2026-11-17", resultado: "ok (CNFP 2025 do SFB, abre de fora do Brasil)"}
