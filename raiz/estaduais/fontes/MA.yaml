# Fontes estaduais do Maranhão. Testado em 17/11/2026: a SEMA-MA abre daqui, mas só publica arquivos para
# retificar o CAR (sem camada de embargos); ITERMA, IMESC e o portal do ZEE fecham a conexão desta nuvem.
uf: MA
verificado_em: "2026-11-17"
fontes:
  - id: ma_iterma_terras
    nome: Terras devolutas, arrecadações e títulos estaduais (ITERMA)
    tema: terra_devoluta
    orgao: ITERMA
    acesso: bloqueado_fora_brasil
    tipo: pendente
    url: https://www.iterma.ma.gov.br/
    efeito: conferir
    motivo: terra_devoluta_a_conferir
    criterio: >-
      Gleba estadual, área arrecadada ou título do ITERMA sobre o imóvel = ressalva. Sem camada: item do checklist
      (o MATOPIBA maranhense tem muito título estadual em disputa).
    lgpd: —
    situacao: {testado_em: "2026-11-17", resultado: "www.iterma.ma.gov.br: conexão fechada daqui"}
    alternativa: ma_glebas_estaduais_cnfp (CNFP 2025), SIGEF nacional e pedido por LAI ao ITERMA.

  - id: ma_zee
    nome: Zoneamento Ecológico-Econômico do Maranhão (bioma amazônico e cerrado)
    tema: zee
    orgao: IMESC / SEMA-MA
    acesso: bloqueado_fora_brasil
    tipo: pendente
    url: https://www.zee.ma.gov.br/
    efeito: conferir
    motivo: zee_a_conferir
    criterio: >-
      Informativo quando chegar: a zona do ZEE pode reduzir a reserva legal para recompor (art. 13 I da Lei
      12.651). Até lá, conferir a zona do imóvel no portal do ZEE.
    lgpd: —
    situacao: {testado_em: "2026-11-17", resultado: "www.zee.ma.gov.br e imesc.ma.gov.br: conexão fechada daqui"}
    alternativa: Rodar do Brasil; o motor usa a regra federal de reserva até a zona entrar.

  - id: ma_sema_ucs
    nome: UCs estaduais e bases de referência do CAR (SEMA-MA, "Banco de dados")
    tema: uc_estadual
    orgao: SEMA-MA
    acesso: sem_download
    tipo: pendente
    url: https://www.sema.ma.gov.br/banco-de-dados
    efeito: conferir
    motivo: uc_estadual_a_conferir
    criterio: >-
      A página lista "UC do estado" e outras bases para retificar o CAR, mas os links não aparecem no HTML (botões
      de download dinâmicos). UC estadual de proteção integral = exclusão; uso sustentável = ressalva.
    lgpd: —
    situacao: {testado_em: "2026-11-17", resultado: "página abre; download só por clique (sem URL fixa no HTML)"}
    alternativa: UCs estaduais pelo CNUC (nacional, já no motor).

  - id: ma_glebas_estaduais_cnfp
    nome: Florestas públicas estaduais não destinadas (CNFP 2025)
    tema: terra_devoluta
    orgao: SFB (CNFP), com dado do ITERMA
    acesso: aberto
    tipo: cnfp
    url: https://www.gov.br/florestal/pt-br/assuntos/cadastro-nacional-de-florestas-publicas
    geometria: poligono
    manter: [categoria, tipo, governo, orgao, protecao]
    efeito: ressalva
    motivo: gleba_estadual
    criterio: >-
      Floresta pública estadual não destinada (tipo B, governo estadual) acima do limiar = ressalva: posse em terra
      do estado; o caminho é a regularização no ITERMA. 
    lgpd: Sem dado pessoal.
    licenca: Dado aberto do governo federal (Decreto 8.777/2016).
    situacao: {testado_em: "2026-11-17", resultado: "ok (CNFP 2025 do SFB, abre de fora do Brasil)"}
