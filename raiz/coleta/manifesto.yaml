# Manifesto de camadas da Raíz (E1 passo 1). Uma entrada por fonte pública.
#
# tipo:        wfs | arcgis | arquivo (HTTP com ETag) | cog (raster na nuvem) | api_mapbiomas | graphql | sidra | parquet
# recorte:     municipio | uf | bbox | brasil       (unidade de replicação e de checagem)
# sinal:       como saber que mudou antes de baixar (campo_data | etag | ano | last_edit | hash | publicado_em | calendario)
# calendario:  diario | dias_semana [0=seg ... 6=dom] | meses [1-12] | rodizio_uf (cada UF num dia da semana)
# licenca / pode_treinar: dado sem licença conferida não entra em treino (pode_treinar: false) até alguém conferir.
# pendente:    o que falta confirmar (endereço, nome de camada); a checagem HEAD avisa quando a rede deixar.
versao: "2026-11-12"

fontes:
  - id: sicar_imoveis
    nome: Cadastro Ambiental Rural, imóveis
    orgao: SFB
    tipo: wfs
    url: https://geoserver.car.gov.br/geoserver/sicar/wfs
    camada: "sicar:sicar_imoveis_{uf}"
    versao_wfs: "2.0.0"
    recorte: municipio
    filtro_municipio: "cod_municipio_ibge={cod}"
    ordenar_por: cod_imovel
    chave: cod_imovel
    pagina: 10000
    tls_legado: true
    sinal: {tipo: campo_data, campo: data_atualizacao, reserva: dat_criacao, margem_dias: 2, detectar_por_uf: true}
    calendario: {rodizio_uf: true}
    licenca: dado aberto do governo federal (Decreto 8.777/2016)
    pode_treinar: true

  - id: sigef_parcelas
    nome: SIGEF, parcelas certificadas
    orgao: INCRA
    tipo: wfs
    url: https://geoportal.incra.gov.br/geoserver/ows
    camada: "geonode:sigef_geo"
    versao_wfs: "2.0.0"
    recorte: municipio
    ordenar_por: parcela_codigo
    chave: parcela_codigo
    pagina: 5000
    sinal: {tipo: campo_data, campo: data_aprovacao, canceladas: anti_juncao_semanal}
    calendario: {dias_semana: [2]}
    espelho_externo: {nome: GeoOne/incra-brasil, conferir: sha256}
    licenca: dado aberto do governo federal (Decreto 8.777/2016)
    pode_treinar: true
    pendente: certificacao.incra.gov.br (ZIP do acervo) fora do ar; pedido de LAI em docs/pedidos/lai-incra.md

  - id: ibama_embargos
    nome: Termos de embargo do Ibama
    orgao: Ibama
    tipo: arquivo
    url: https://stibamadadosabertosprd.blob.core.windows.net/dados-abertos/dados/TERMOS_DE_EMBARGO/TERMO_EMBARGO/termo_de_embargo.csv
    recorte: brasil
    chave: SEQ_TAD
    sinal: {tipo: etag, campos_data: [DAT_ULT_ALTERACAO, DAT_ULT_ALTER_GEOM]}
    calendario: diario
    descartar_na_entrada: [nome, cpf, cnpj]
    licenca: dado aberto do governo federal (Decreto 8.777/2016)
    pode_treinar: true

  - id: ibama_embargos_historico
    nome: Histórico dos termos de embargo (changelog)
    orgao: Ibama
    tipo: arquivo
    url: null
    recorte: brasil
    sinal: {tipo: etag}
    calendario: diario
    descartar_na_entrada: [nome, cpf, cnpj]
    licenca: dado aberto do governo federal (Decreto 8.777/2016)
    pode_treinar: true
    pendente: endereço do termo_embargo_historico.csv no portal de dados abertos do Ibama

  - id: prodes
    nome: PRODES (desmatamento anual, acumulado, não floresta, hidrografia), por bioma
    orgao: INPE
    tipo: wfs
    url: https://terrabrasilis.dpi.inpe.br/geoserver/ows
    camada: "{espaco}:{camada}"   # espaços e camadas por bioma: motor/raiz_estado.py (BIOMA_WS, AMZ_LEGAL)
    versao_wfs: "1.0.0"
    recorte: bbox
    bloco_graus: 0.5
    sinal: {tipo: ano, mes_publicacao: 10}
    calendario: {meses: [10, 11, 12]}
    licenca: a conferir (TerraBrasilis/INPE)
    pode_treinar: true
    pendente: last_update_date.json e nomes de arquivo da área de download do PRODES

  - id: deter
    nome: DETER (alertas de desmatamento)
    orgao: INPE
    tipo: wfs
    url: https://terrabrasilis.dpi.inpe.br/geoserver/ows
    camada: "deter-amz:deter_amz"
    versao_wfs: "2.0.0"
    recorte: uf
    chave_composta: [gid, view_date]
    sinal: {tipo: campo_data, campo: view_date, janela_dias: 30}
    calendario: {dias_semana: [5]}
    recarga_completa: anual depois do PRODES
    licenca: a conferir (TerraBrasilis/INPE)
    pode_treinar: true
    pendente: confirmar nomes das camadas do DETER Amazônia e Cerrado pelo GetCapabilities

  - id: mapbiomas_plataforma
    nome: MapBiomas pela API da Plataforma (exportação por município, GeoTIFF)
    orgao: MapBiomas
    tipo: api_mapbiomas
    url: https://prd.plataforma.mapbiomas.org/api/v1/brazil
    cabecalhos: {tenant-id: mapbiomas}
    categoria_municipio: 230
    subtemas:
      cobertura: coverage_coverage-30m-droufo
      secundaria_idade: secondary-vegetation-copy-t41ydh_annual-lfh76u_age
      pastagem: "pastagem-copia-0dzt61_*"
      fogo_mensal: fogo-copia-1h7mac_monthly-433exq
      desmatamento: desmatamento-copia-12xxov_annual-c5i7xj
    recorte: municipio
    sinal: {tipo: calendario}
    calendario: {dias_semana: [0]}
    alternativa: Earth Engine (motor/gee/*.js), para o que a API não tiver
    licenca: a conferir (MapBiomas)
    pode_treinar: false

  - id: mapbiomas_alerta
    nome: MapBiomas Alerta (desmatamento validado)
    orgao: MapBiomas
    tipo: graphql
    url: https://plataforma.alerta.mapbiomas.org/api/v2/graphql
    credenciais: [MAPBIOMAS_ALERTA_EMAIL, MAPBIOMAS_ALERTA_SENHA]
    recorte: uf
    sinal: {tipo: publicado_em, janela_dias: 35, reler: statusAt}
    calendario: {dias_semana: [0]}
    licenca: a conferir (MapBiomas Alerta)
    pode_treinar: false

  - id: ybyra_secundaria
    nome: YbYrá-BR v8.1, vegetação secundária (idade e incremento)
    orgao: YbYrá-BR (Source Cooperative)
    tipo: cog
    url: https://data.source.coop/ybyra-br/secondary-forest/{produto}/ybyra_secondary_forest_{produto}_brazil_v8_1_{ano}.tif
    produtos: [age, increment]
    anos: [2024]
    recorte: brasil
    sinal: {tipo: etag}
    calendario: {meses: [1, 7]}
    licenca: a conferir (YbYrá-BR)
    pode_treinar: false
    pendente: os outros dois produtos do YbYrá citados no plano

  - id: gpw_pasto
    nome: Global Pasture Watch, altura da vegetação baixa e uGPP
    orgao: OpenGeoHub
    tipo: cog
    url: https://s3.opengeohub.org/gpw/arco/gpw_{produto}_30m_s_{ano}0101_{ano}1231_go_epsg.4326_v1.tif
    produtos: [short.veg.height_egbt_m, ugpp_lue.model_m]
    anos: [2024]
    recorte: brasil
    sinal: {tipo: etag}
    calendario: {meses: [1, 7]}
    licenca: a conferir (OpenGeoHub)
    pode_treinar: false

  - id: geobr_territorios
    nome: Quilombos (INCRA), terras indígenas (FUNAI) e unidades de conservação (CNUC), via geobr/Ipea
    orgao: Ipea (geobr)
    tipo: parquet
    url: https://www.ipea.gov.br/geobr/data_v2.0.0/{arquivo}
    arquivos: [quilombolalands_202605.parquet, indigenouslands_2025.parquet, conservationunits_202503.parquet]
    recorte: brasil
    sinal: {tipo: etag}
    calendario: {meses: [1, 4, 7, 10]}
    licenca: a conferir (geobr é MIT; os dados seguem a licença de cada órgão)
    pode_treinar: true

  - id: ibge_ppm
    nome: Pesquisa da Pecuária Municipal (efetivo dos rebanhos)
    orgao: IBGE
    tipo: sidra
    url: https://apisidra.ibge.gov.br/values/t/3939
    produto_calendario: 9107
    url_calendario: https://servicodados.ibge.gov.br/api/v3/calendario/9107
    recorte: municipio
    sinal: {tipo: calendario}
    calendario: gatilho_ibge
    licenca: dado aberto do governo federal (Decreto 8.777/2016)
    pode_treinar: true
    pendente: conferir robots e termos do servicodados.ibge.gov.br antes de ligar o gatilho

  - id: sigmine
    nome: SIGMINE (processos minerários)
    orgao: ANM
    tipo: arquivo
    url: null
    recorte: brasil
    sinal: {tipo: etag}
    calendario: {dias_semana: [3]}
    licenca: dado aberto do governo federal (Decreto 8.777/2016)
    pode_treinar: true
    pendente: endereço do conjunto em dadosabertos.anm.gov.br (o SIGMINE mudou para lá)

referencias:
  # dados de pesquisa usados pelas contas; não são coletados, mas a licença decide o uso
  - id: groa
    nome: GROA (Global Reforestation Opportunity Assessment), taxas de acúmulo de carbono
    licenca: CC BY 4.0
    pode_treinar: true
    uso: calibração do carbono (E3)
  - id: heinrich_2021
    nome: Heinrich et al. 2021 (Nature Communications), taxas de regeneração na Amazônia
    licenca: não comercial
    pode_treinar: false
    uso: só comparação, fora do treino
