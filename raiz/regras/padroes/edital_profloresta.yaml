# Requisitos que o desenvolvedor entrega numa proposta do ProFloresta+ (e no registro Verra VM0047), da aba "Pacote
# para o edital" da rodada 11 de pesquisa (12/11/2026). Usado por raiz/lote.py para montar o checklist
# do lote: cada item com gravidade (bloqueia, alta, media, baixa), fonte e, quando dá para conferir com os dados da
# Raíz, a checagem automática (`checagem`). Os demais ficam "a conferir" com quem faz.
# Itens marcados "provável na fase 2" vêm dos leilões de energia, porque o edital da fase 2 ainda não saiu.
versao: edital-profloresta-2026-11
gravidades:
- bloqueia
- alta
- media
- baixa
itens:
- id: area_de_pelo_menos_3
  bloco: 1. Terra e direito ao carbono
  item: 'Área de pelo menos 3.000 ha por projeto (fase 1: só Amazônia; fase 2: bioma e área mínima ainda não publicados)'
  exigido_por: Edital do ProFloresta+ (especificação técnica, itens C e 2.6)
  gravidade: bloqueia
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual-especificacao-tecnica.pdf
  raiz_fornece: Polígono do CAR por imóvel, bioma e área em ha; agrupamento de fazendas em construção
  falta_construir: Somar só os hectares elegíveis do lote (pasto e área aberta), conferir 100% no bioma e agrupar fazendas
    por custo líquido por crédito (molde do cerf, BSD-2)
  de_onde_vem_o_dado: CAR (SICAR), limite de biomas do IBGE, MapBiomas
  horas: 3 a 5
  checagem: area_minima
- id: pelo_menos_5_da_area
  bloco: 1. Terra e direito ao carbono
  item: Pelo menos 5% da área homologada na assinatura (150 ha num projeto de 3.000 ha)
  exigido_por: Edital do ProFloresta+ (minuta, cláusula 3.6.1)
  gravidade: bloqueia
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual.pdf
  raiz_fornece: Checagem de título e pedido de aceite do dono
  falta_construir: Marcar as fazendas da área inicial (título mais limpo, aceite assinado, sem embargo) e mostrar o status
    do lote
  de_onde_vem_o_dado: Aceite do dono e laudo de título da Raíz
  horas: 2 a 3
  checagem: area_inicial
- id: prova_do_direito_de_usar
  bloco: 1. Terra e direito ao carbono
  item: Prova do direito de usar a terra de cada fazenda (opção, arrendamento, superfície ou servidão assinados, com data
    e prazo)
  exigido_por: Edital do ProFloresta+ (minuta, cláusula 15.2); molde da Portaria MME 102/2016 (art. 4º, § 3º, II)
  gravidade: bloqueia
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual.pdf | https://www.gov.br/mme/pt-br/arquivos/portaria-n-102-2016.pdf
  raiz_fornece: Checagem de título (SIGEF e CAR) e pedido de aceite
  falta_construir: 'Aceite em duas fases: opção paga até o resultado do leilão e contrato firme de 40 anos depois (longevidade
    mínima da Verra), com o instrumento registrável escolhido e pagamento de espera até a primeira entrega'
  de_onde_vem_o_dado: Dono (assinatura), matrícula, SIGEF e CAR
  horas: 8 a 14
- id: cessao_integral_e_irrevogavel_pelos
  bloco: 1. Terra e direito ao carbono
  item: Cessão integral e irrevogável, pelos proprietários, dos direitos sobre os créditos de carbono
  exigido_por: Edital do ProFloresta+ (minuta, cláusula 3.6.2)
  gravidade: bloqueia
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual.pdf
  raiz_fornece: Pedido de aceite do dono
  falta_construir: Termo de cessão por 25 anos ou mais dentro do aceite, com assinatura eletrônica e guarda do documento
  de_onde_vem_o_dado: Dono e cartório, quando houver registro
  horas: 4 a 8
  checagem: cessao_carbono
- id: individualizacao_dos_proprietarios_e_contratos
  bloco: 1. Terra e direito ao carbono
  item: Individualização dos proprietários e contratos que garantem o imóvel e os créditos
  exigido_por: Edital do ProFloresta+ (especificação técnica, item d)
  gravidade: media
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual-especificacao-tecnica.pdf
  raiz_fornece: Cartório (CNS) e número da matrícula das parcelas SIGEF; guarda de CPF e CNPJ
  falta_construir: Tabela por imóvel com titular mascarado, matrícula e tipo de contrato
  de_onde_vem_o_dado: Certidão de inteiro teor, SIGEF e contrato assinado
  horas: 6 a 10
- id: diligencia_juridica_sobre_proprietarios_e
  bloco: 1. Terra e direito ao carbono
  item: Diligência jurídica sobre proprietários e possuidores e regularidade fundiária
  exigido_por: Edital do ProFloresta+ (minuta, cláusulas 15.2 e 3.1.2)
  gravidade: bloqueia
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual.pdf
  raiz_fornece: Laudo de título por imóvel (plano da E5)
  falta_construir: Pôr no laudo os ônus da matrícula e a sobreposição com outras posses, e exportar o laudo como anexo
  de_onde_vem_o_dado: Matrícula, SIGEF, CAR e certidões
  horas: dentro das horas do laudo da E5
- id: georreferenciamento_das_areas_de_preferencia
  bloco: 1. Terra e direito ao carbono
  item: Georreferenciamento das áreas, de preferência certificado no INCRA
  exigido_por: Edital do ProFloresta+ (especificação técnica, item c.1)
  gravidade: media
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual-especificacao-tecnica.pdf
  raiz_fornece: Área no SIGEF e na matrícula por imóvel
  falta_construir: Aviso "precisa georreferenciar" para fazenda sem SIGEF ou com SIGEF diferente do CAR, com a diferença
    em ha
  de_onde_vem_o_dado: SIGEF (INCRA) e CAR
  horas: 2 a 4
- id: terreno_exclusivo_e_sem_sobreposicao
  bloco: 1. Terra e direito ao carbono
  item: Terreno exclusivo e sem sobreposição com outros projetos ou entre fazendas do lote
  exigido_por: Verra VM0047 (limites sem sobreposição); lição do PROINFA (terra sem garantia gerou atraso)
  gravidade: bloqueia
  fonte: https://verra.org/documents/vm0047-afforestation-reforestation-and-revegetation-v1-1/ | https://gwec.net/wp-content/uploads/2021/01/GWEC_Analysis-of-the-regulatory-framework-in-Brazil_2011.pdf
  raiz_fornece: Sobreposição com projetos de carbono registrados
  falta_construir: Marca de exclusividade por fazenda com prazo; checagem de sobreposição dentro do lote e da faixa de 10
    m entre estratos de abordagens diferentes
  de_onde_vem_o_dado: Polígonos da Raíz e registros da Verra
  horas: 3 a 6
  checagem: sem_sobreposicao
- id: contrato_com_o_dono_de
  bloco: 1. Terra e direito ao carbono
  item: Contrato com o dono de pelo menos 40 anos, a longevidade mínima da Verra; se a fazenda sair antes, o projeto perde
    todo o crédito já verificado dela ou monitora até o fim
  exigido_por: Verra VCS Standard v5.0 (3.2.12, 3.2.19 e 3.2.20), para registros a partir de 1/1/2027
  gravidade: bloqueia
  fonte: https://verra.org/documents/vcs-standard-v5-0/
  raiz_fornece: Nada
  falta_construir: Prazo de 40 anos no modelo de contrato, coluna "risco de saída do dono" e custo de monitorar depois da
    saída no valor da fazenda
  de_onde_vem_o_dado: Contrato do dono e Raíz
  horas: 3 a 4
  checagem: contrato_40_anos
- id: tabela_de_evidencias_do_direito
  bloco: 1. Terra e direito ao carbono
  item: Tabela de evidências do direito de operar e do direito às remoções de cada fazenda (instrumento, data, registro
    e base legal)
  exigido_por: Verra VCS Standard v5.0 (3.6) e guia de direito de operar v5.0
  gravidade: alta
  fonte: https://verra.org/documents/vcs-guidance-right-to-operate-sustainable-development-stakeholder-engagement-and-safeguards-v5-0/
  raiz_fornece: Checagem de título e aceite
  falta_construir: Exportar a tabela por fazenda no formato do guia da Verra e revisar a cada verificação
  de_onde_vem_o_dado: Contrato, matrícula e SIGEF
  horas: 6 a 10
- id: servidao_ambiental_averbada_ou_direito
  bloco: 1. Terra e direito ao carbono
  item: Servidão ambiental averbada ou direito de superfície registrado na matrícula, com memorial georreferenciado
  exigido_por: Lei 6.938 (arts. 9-A e 9-C) e registro de imóveis
  gravidade: alta
  fonte: https://www2.camara.leg.br/legin/fed/lei/2012/lei-12651-25-maio-2012-613076-normaatualizada-pl.html
  raiz_fornece: Polígono SIGEF e CAR
  falta_construir: Memorial descritivo no formato do cartório e envio por extrato eletrônico
  de_onde_vem_o_dado: Cartório, SIGEF e contrato
  horas: 10 a 16
- id: desenvolvedor_controlado_por_capital_estrangeiro
  bloco: 1. Terra e direito ao carbono
  item: 'Desenvolvedor controlado por capital estrangeiro: os limites da Lei 5.709/71 valem também para o arrendamento (STF,
    23/04/2026)'
  exigido_por: Lei 5.709/71, Lei 8.629/93 (art. 23) e decisão do STF (ADPF 342 e ACO 2463)
  gravidade: alta
  fonte: https://www.demarest.com.br/stf-reafirma-validade-das-restricoes-a-aquisicao-e-ao-arrendamento-de-imoveis-rurais-por-estrangeiros-e-empresas-brasileiras-equiparadas/
  raiz_fornece: Nada
  falta_construir: Campo de controle do capital no cadastro do desenvolvedor, soma de área por município e regra que troca
    o tipo de contrato sugerido
  de_onde_vem_o_dado: Desenvolvedor e Raíz
  horas: 3 a 5
- id: assinatura_do_dono_com_nivel
  bloco: 1. Terra e direito ao carbono
  item: Assinatura do dono com nível aceito pelo registro de imóveis
  exigido_por: Lei 6.015 (art. 17) e Provimento CNJ 195/2025
  gravidade: alta
  fonte: https://www.migalhas.com.br/coluna/migalhas-notariais-e-registrais/440010/retificacao-de-area-e-o-provimento-cnj-195-25--parte-3
  raiz_fornece: Nada
  falta_construir: Checar o nível da conta gov.br (prata ou ouro) ou usar o e-Not Assina, e validar o PDF assinado
  de_onde_vem_o_dado: Assinatura do dono
  horas: 3 a 6
- id: salvaguardas_do_contrato_com_o
  bloco: 1. Terra e direito ao carbono
  item: 'Salvaguardas do contrato com o dono: minuta entregue 60 dias antes, revisão a cada 5 anos e sem renovação automática'
  exigido_por: MPF (Recomendações 22/2023 e 30/2025, para arrendamentos de eólica e solar); provável na fase 2
  gravidade: media
  fonte: https://www.mayerbrown.com/pt/insights/publications/2026/02/mpf-recommendations-on-land-lease-agreements-for-energy-projects
  raiz_fornece: Nada
  falta_construir: Validador de prazos e cláusulas no contrato gerado
  de_onde_vem_o_dado: Contrato gerado pela Raíz
  horas: 4 a 6
- id: regularizacao_ambiental_e_ausencia_de
  bloco: 2. Meio ambiente e salvaguardas
  item: Regularização ambiental e ausência de desmatamento ilegal
  exigido_por: Edital do ProFloresta+ (especificação técnica, item 2.4.5)
  gravidade: bloqueia
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual-especificacao-tecnica.pdf
  raiz_fornece: Desmatamento depois de 2008, 2016 e 2020, embargos e alertas por imóvel
  falta_construir: 'Prova por fazenda para o anexo: recorte do PRODES e do MapBiomas Alerta com datas'
  de_onde_vem_o_dado: PRODES (INPE), embargos do Ibama, MapBiomas Alerta
  horas: 2 a 4
  checagem: sem_desmatamento
- id: situacao_do_car_e_do
  bloco: 2. Meio ambiente e salvaguardas
  item: Situação do CAR e do PRA de cada fazenda
  exigido_por: BNDES; molde da Portaria MME 102/2016 (art. 4º, § 3º, VIII)
  gravidade: media
  fonte: https://www.gov.br/mme/pt-br/arquivos/portaria-n-102-2016.pdf
  raiz_fornece: Situação do CAR e embargos
  falta_construir: Campo de situação do PRA ou termo de compromisso e a declaração de situação ambiental do lote
  de_onde_vem_o_dado: SICAR, Ibama e órgão estadual
  horas: 4 a 8
- id: uc_app_reserva_legal_e
  bloco: 2. Meio ambiente e salvaguardas
  item: UC, APP, Reserva Legal e ocupações indicadas; APP e RL só entram com adicionalidade
  exigido_por: Edital do ProFloresta+ (especificação técnica, itens c.1 e 2.4.1)
  gravidade: media
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual-especificacao-tecnica.pdf
  raiz_fornece: UC, APP pela escadinha do art. 61-A, déficit de RL, filtros de TI, quilombo e UC
  falta_construir: Separar em cada fazenda os ha que a lei já obriga a recompor dos ha voluntários
  de_onde_vem_o_dado: CAR, hidrografia e Código Florestal
  horas: 3 a 5
- id: salvaguardas_partes_interessadas_consulta_livre
  bloco: 2. Meio ambiente e salvaguardas
  item: 'Salvaguardas: partes interessadas, consulta livre, prévia e informada (Convenção 169 da OIT), ouvidoria e matriz
    de riscos'
  exigido_por: Edital do ProFloresta+ (especificação técnica, itens 3.1 a 3.11)
  gravidade: alta
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual-especificacao-tecnica.pdf
  raiz_fornece: Filtros de TI, quilombo e UC
  falta_construir: Distância a TI, quilombo e comunidades, aviso "precisa consulta prévia" e lista de partes interessadas
  de_onde_vem_o_dado: FUNAI, INCRA, CNUC e IBGE
  horas: 3 a 5
- id: certidoes_negativas_e_licencas_do
  bloco: 2. Meio ambiente e salvaguardas
  item: Certidões negativas e licenças do desenvolvedor e das fazendas
  exigido_por: BNDES (análise socioambiental e cadastral)
  gravidade: media
  fonte: https://bndes.gov.br/wps/portal/site/home/financiamento/produto/leiloes-infraestrutura/leilao-geracao-2018/
  raiz_fornece: Embargos do Ibama por fazenda
  falta_construir: Checklist de certidões com data de validade dentro do dossiê do lote
  de_onde_vem_o_dado: Bases públicas já coletadas e certidões emitidas pelo desenvolvedor
  horas: 3 a 5
- id: integridade_e_sancoes_declaracoes_anticorrupcao
  bloco: 2. Meio ambiente e salvaguardas
  item: 'Integridade e sanções: declarações anticorrupção e controles verificáveis pela compradora por até 10 anos'
  exigido_por: Edital do ProFloresta+ (minuta, cláusula 22)
  gravidade: bloqueia
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual.pdf
  raiz_fornece: Nada
  falta_construir: Checagem do CNPJ do desenvolvedor e das empresas donas de terra em listas públicas de sanção (só pessoa
    jurídica)
  de_onde_vem_o_dado: CGU (listas de empresas sancionadas) e embargos
  horas: 2 a 4
- id: arr_que_melhora_a_integridade
  bloco: 2. Meio ambiente e salvaguardas
  item: ARR que melhora a integridade do ecossistema rumo a uma referência e não fecha campo ou savana nativa
  exigido_por: Verra VCS Standard v5.0 (V5#23), para início a partir de 1/1/2027
  gravidade: media
  fonte: https://verra.org/documents/vcs-version-5-overview-of-vcs-program-updates-and-effective-dates/
  raiz_fornece: Nada
  falta_construir: Coluna "ecossistema de referência" por fazenda (floresta ou savana) e alerta quando o plano de plantio
    fecha campo nativo
  de_onde_vem_o_dado: MapBiomas e mapa de vegetação do IBGE
  horas: 3 a 4
- id: modalidade_de_restauracao_por_area
  bloco: 3. Restauração no campo
  item: 'Modalidade de restauração por área: plantio, semeadura direta ou condução da regeneração com adensamento e nucleação'
  exigido_por: Edital do ProFloresta+ (especificação técnica, itens E, G, H e 1.1)
  gravidade: alta
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual-especificacao-tecnica.pdf
  raiz_fornece: Coluna de modo por fazenda em construção; idade da secundária, distância à floresta
  falta_construir: Polígonos por modo dentro de cada fazenda, com a regra de cobertura florestal de 40% e 60% num raio de
    4 km (Rito et al. 2022)
  de_onde_vem_o_dado: YbYrá, MapBiomas e distância à floresta
  horas: 6 a 10
  checagem: modalidade
- id: lista_de_especies_pelo_menos
  bloco: 3. Restauração no campo
  item: 'Lista de espécies: pelo menos 30 nativas, 40% de diversidade funcional, 40% zoocóricas e ameaçadas regionais'
  exigido_por: Edital do ProFloresta+ (especificação técnica, itens 1.3.1 e 1.3.2)
  gravidade: media
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual-especificacao-tecnica.pdf
  raiz_fornece: Nada
  falta_construir: Lista sugerida por fitofisionomia e município, marcando zoocórica e ameaçada
  de_onde_vem_o_dado: Flora e Funga do Brasil e lista oficial de flora ameaçada
  horas: 6 a 10
- id: mudas_e_sementes_de_fornecedores
  bloco: 3. Restauração no campo
  item: Mudas e sementes de fornecedores inscritos no RENASEM, de preferência locais
  exigido_por: Edital do ProFloresta+ (especificação técnica, itens 1.4 e 3.2.1)
  gravidade: media
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual-especificacao-tecnica.pdf
