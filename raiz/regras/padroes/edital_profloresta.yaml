- id: prevencao_e_combate_a_incendios
  bloco: 3. Restauração no campo
  item: Prevenção e combate a incêndios
  exigido_por: Edital do ProFloresta+ (especificação técnica, item 1.10)
  gravidade: media
  fonte: https://www.bndes.gov.br/arquivos/bndes-florestas/profloresta-minuta-contratual-especificacao-tecnica.pdf
