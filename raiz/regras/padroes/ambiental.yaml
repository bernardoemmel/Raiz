# Vegetação e relevo na triagem (raiz/ambiental/status.py): reserva legal pelo tipo de vegetação do IBGE, área de
# aplicação da Lei da Mata Atlântica, TerraClass (pasto sujo x regeneração) e APP de relevo pelo ANADEM.
# Cada imóvel recebe "ressalva" (fica no lote, marcado, com o motivo), "livre" (as fontes essenciais cobriram e nada
# marcou) ou "nao_verificado" (faltou fonte essencial; ausência de dado nunca vira "livre"). Nada aqui exclui imóvel:
# reserva a recompor e APP aberta são oportunidade de restauração, não impedimento.
# Mudou este arquivo: a versão da tarefa "ambiental" muda e só ela (e quem lê a saída dela) refaz.
#
# Nunca descartar imóvel por tamanho: os limiares medem a ÁREA MARCADA (ha ou fração do imóvel), não a fazenda.
versao: ambiental-2026a
adotado_em: "2026-11-17"

limiar_ha: 1.0
limiar_fracao: 0.05

# Fontes sem as quais o imóvel nunca é "livre". TerraClass é complemento (só cobre Amazônia e Cerrado).
fontes_essenciais: [vegetacao, relevo]

reserva_legal:
  # Lei 12.651/2012, art. 12. Na Amazônia Legal: 80% em área de florestas, 35% em área de cerrado, 20% em área de
  # campos gerais; fora dela, 20%. §2º: imóvel com mais de um tipo soma cada parte com o seu índice.
  amazonia_legal: {floresta: 80, cerrado: 35, campos: 20}
  fora_amazonia_legal: 20
  # Contato floresta x savana (ecótono ou encrave): o órgão estadual decide caso a caso. Usa o maior índice
  # (conservador para a oferta de carbono) e marca a ressalva rl_transicao.
  transicao: 80
  # Mesma convenção do motor (motor/raiz_estado.py, PCT_ALEM): a área "além da reserva" usa 50% na parte de floresta
  # (art. 12 §4º e §5º, redução por ZEE ou por UC/TI); cerrado e campos ficam com o próprio índice.
  floresta_alem: 50
  # Lei Complementar 124/2007, art. 2º: o Maranhão entra na Amazônia Legal só a oeste do meridiano de 44º.
  ufs: [AC, AM, AP, MA, MT, PA, RO, RR, TO]
  maranhao_meridiano: -44.0
  # Diferença entre o índice pela vegetação e o que o motor usou (pelo bioma no centro do imóvel) que vira ressalva.
  divergencia_pontos: 5

# Classificação do Mapa de Vegetação do IBGE 1:250 000 (BDiA, versão 2026, vege_area.shp). Para área natural usa a
# vegetação que está lá (leg_uveg); para área antropizada, a vegetação pretérita (veg_pretet, região fitoecológica).
vegetacao:
  # regiões fitoecológicas (letras do IBGE): D, A, M ombrófilas; F, C, H estacionais (O e N nos contatos)
  floresta: [D, A, M, F, C, H, O, N]
  cerrado: [S, T]
  campos: [E, P, r]
  # Campinarana: florestada (Ld) é floresta; arborizada e arbustiva (La, Lb) cerrado; gramíneo-lenhosa (Lg) campos.
  # Sem subtipo (área antropizada): floresta (conservador).
  campinarana_sem_subtipo: floresta
  # subtipo gramíneo-lenhoso de savana e savana-estépica (Sg, Tg) é campo; formação pioneira arbórea (mangue) é
  # floresta (a definição usa o nome do IBGE: "arbórea", "Manguezal")
  gramineo_lenhosa: [Sg, Tg, Lg]

# Lei 11.428/2006 e Decreto 6.660/2008. O IBGE publica o Mapa da Área de Aplicação só em PDF; o vetor aqui é a
# aproximação pelo próprio mapa de vegetação do IBGE: nos 17 estados do mapa, a área das formações do art. 2º
# (ombrófilas densa, mista e aberta, estacionais semidecidual e decidual, manguezais, restingas e brejos/encraves, e
# os contatos que têm uma delas). Fonte marcada como proxy_ibge_250mil.
lei_mata_atlantica:
  ufs: [AL, BA, CE, ES, GO, MS, MG, PB, PR, PE, PI, RJ, RN, RS, SC, SE, SP]
  regioes: [D, A, M, F, C, O, N, P, r]

terraclass:
  # Links diretos de arquivos do TerraClass (GeoTIFF terraclass_<bioma>_<ano>*.tif, com a legenda .json ao lado).
  # Vazio enquanto o INPE/Embrapa não publicar um link estável (o portal só entrega numa sessão do navegador).
  urls: []
  # Nomes das classes (legenda que vem com o arquivo); casamento sem acento e sem caixa.
  pasto_sujo: ["PASTAGEM ARBUSTIVA", "PASTAGEM ARBOREA", "PASTO SUJO"]
  pasto_limpo: ["PASTAGEM HERBACEA", "PASTO LIMPO"]
  vegetacao_secundaria: ["SECUNDARIA"]
  # Legenda de reserva (TerraClass Amazônia 2018-2022), usada só quando o arquivo vier sem legenda própria.
  legenda_amazonia:
    1: VEGETACAO NATURAL FLORESTAL PRIMARIA
    2: VEGETACAO NATURAL FLORESTAL SECUNDARIA
    9: SILVICULTURA
    10: PASTAGEM ARBUSTIVA/ARBOREA
    11: PASTAGEM HERBACEA
    12: CULTURA AGRICOLA PERENE
    13: CULTURA AGRICOLA SEMIPERENE
    14: CULTURA AGRICOLA TEMPORARIA DE 1 CICLO
    15: CULTURA AGRICOLA TEMPORARIA DE MAIS DE 1 CICLO
    16: MINERACAO
    17: URBANIZADA
    20: OUTROS USOS
    22: DESFLORESTAMENTO NO ANO
    23: CORPO DAGUA
    25: NAO OBSERVADO

relevo:
  # ANADEM v1 (Laipelt et al. 2024): Copernicus GLO-30 sem o viés da vegetação, 30 m, tiles por zona UTM e faixa de
  # latitude (ex.: 22M), leitura por faixa via HTTP. O GLO-30 (superfície, com a copa) é a reserva, marcada.
  anadem_url: https://metadados.snirh.gov.br/files/anadem_v1_tiles/anadem_v1_{tile}.tif
  # art. 4º, V: encosta com declividade maior que 45 graus
  declividade_graus: 45
  # art. 4º, IX: morro ou montanha com altura mínima de 100 m e inclinação média maior que 25 graus; a APP é o terço
  # de cima: acima da curva de 2/3 da altura, contada da base (planície, espelho d'água ou ponto de sela mais próximo)
  topo_altura_m: 100
  topo_inclinacao_graus: 25
  topo_fracao: 0.6667
  # bloco de cálculo (graus) e borda para a elevação ter contexto (graus)
  bloco_graus: 0.25
  borda_graus: 0.05
  # classes da cobertura do MapBiomas que contam como APP aberta (pasto, agricultura, mosaico, silvicultura,
  # área não vegetada); com uso consolidado antes de 22/07/2008 o art. 63 permite manter a atividade
  mapbiomas_aberto: [9, 15, 18, 19, 20, 21, 22, 23, 24, 25, 29, 30, 35, 36, 39, 40, 41, 46, 47, 48, 62]

motivos:
  rl_vegetacao_diverge: "Reserva legal pela vegetação do IBGE diferente da usada pelo motor (bioma no centro do imóvel); vale o índice por tipo de vegetação (art. 12)"
  rl_transicao: "Área de contato floresta x savana: o órgão estadual define se é floresta (80%) ou cerrado (35%); a Raíz usa 80% até confirmar"
  fora_amazonia_legal_maranhao: "Parte do imóvel no Maranhão a leste do meridiano de 44º: fora da Amazônia Legal (reserva de 20%)"
  lei_mata_atlantica: "Área de aplicação da Lei da Mata Atlântica: vegetação secundária em estágio médio ou avançado não pode ser suprimida; plantio e regeneração seguem o Decreto 6.660/2008"
  pasto_sujo: "Pasto sujo (TerraClass): restauração mais barata por regeneração assistida, mas a linha de base dinâmica pode descontar créditos (adicionalidade)"
  regeneracao_existente: "Vegetação secundária já em pé (TerraClass): não entra como área nova de restauração; conferir a idade e a linha de base"
  app_relevo_aberta: "APP de declividade ou topo de morro aberta (ANADEM + MapBiomas): conferir se é uso consolidado antes de 2008 (art. 63) ou área a recompor"
  relevo_sem_anadem: "Relevo calculado no Copernicus GLO-30 (com a copa): a APP de relevo sob floresta pode estar superestimada"
