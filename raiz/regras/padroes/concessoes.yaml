# Concessões e editais de concessão em terra pública (SFB, gov.br/florestal, e Ideflor-Bio, Pará). Cada entrada guarda
# a data e o link da fonte; `raiz terra editais` confere as páginas das duas fontes e avisa quando mudam.
# vinculo: como achar a área no mapa. uc = nome da unidade de conservação no CNUC (o polígono inteiro, quando a
# concessão cobre só parte dele, area_exata fica false); cnfp = nome da gleba no Cadastro Nacional de Florestas
# Públicas. Imóvel do CAR só vira "pública sob concessão" quando a área é exata ou a UC é toda de domínio público.
versao: concessoes-2026b
conferido_em: "2026-11-12"
fontes:
  sfb: https://www.gov.br/florestal/pt-br/assuntos/concessoes-e-monitoramento/editais-em-licitacao
  ideflor_bio: https://ideflorbio.pa.gov.br/licitacoes-e-contratos/

