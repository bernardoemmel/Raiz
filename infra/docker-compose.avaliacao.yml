# Só dados fictícios. Portas loopback distintas da pilha de desenvolvimento/produção.
name: raiz-avaliacao
services:
  banco:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: raiz_avaliacao
      POSTGRES_PASSWORD: avaliacao-local-sem-dados-reais
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U raiz_avaliacao -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    tmpfs: [/var/lib/postgresql/data]
  valkey:
    image: valkey/valkey:8.1.6-alpine
    command: [valkey-server, --save, "", --appendonly, "no"]
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 40
  banco-oauth:
    image: postgres:16.11
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: avaliacao-oauth-local-sem-dados-reais
      POSTGRES_DB: keycloak
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak"]
      interval: 3s
      timeout: 3s
      retries: 40
    tmpfs: [/var/lib/postgresql/data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --http-port=8080]
    depends_on:
      banco-oauth:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://banco-oauth:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: avaliacao-oauth-local-sem-dados-reais
      KC_BOOTSTRAP_ADMIN_USERNAME: ${RAIZ_AVALIACAO_KEYCLOAK_ADMIN:-avaliador}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${RAIZ_AVALIACAO_KEYCLOAK_SENHA:-avaliacao-local-sem-dados-reais}
      KC_HOSTNAME: http://127.0.0.1:18180
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:18180:8080"]
