# Serviços da Raíz numa máquina (4 núcleos, 15 GB). Arquivos grandes ficam no R2, não aqui.
# Uso, a partir da raiz do repositório:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
#   uv run raiz banco migrar
# Os serviços seguintes (API, worker, llama.cpp, Langfuse com Valkey) entram aqui quando cada etapa chegar.
# Langfuse: NÃO usar Redis (SSPL/RSAL/AGPL) nem MinIO (AGPL); usar Valkey (BSD-3) e R2 ou SeaweedFS (Apache-2.0).

name: raiz

services:
  banco:
    image: postgis/postgis:16-3.5  # PostgreSQL (licença PostgreSQL) + PostGIS (GPL-2, só no servidor)
    restart: unless-stopped
    environment:
      POSTGRES_USER: raiz
      POSTGRES_PASSWORD: ${RAIZ_BANCO_SENHA:?defina RAIZ_BANCO_SENHA no .env}
      POSTGRES_DB: raiz
    command: >-
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c max_wal_size=4GB
      -c random_page_cost=1.1
    shm_size: 1g
    ports:
      - "127.0.0.1:5432:5432"  # só a própria máquina
    volumes:
      - banco:/var/lib/postgresql/data
      - ./banco/init:/docker-entrypoint-initdb.d:ro  # cria a base do Langfuse no primeiro start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raiz -d raiz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Modelo local: Qwen3-4B-Instruct-2507 (Apache-2.0) no llama-server (llama.cpp, MIT), em CPU.
  # Baixe o GGUF (Q4_K_M, ~2,5 GB) da página do modelo no Hugging Face para infra/modelos/ e confira a licença.
  # O JSON sai por gramática: o servidor converte o JSON Schema do pedido (response_format) em gramática GBNF.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command: >-
      -m /modelos/qwen3-4b-instruct-2507-q4_k_m.gguf
      --alias qwen3-4b-instruct-2507
      --host 0.0.0.0 --port 8080
      --ctx-size 8192 --threads 3 --parallel 1 --jinja
    volumes:
      - ./modelos:/modelos:ro
    ports:
      - "127.0.0.1:8080:8080"

  # Revisor de estilo e legibilidade do português: LanguageTool 6.6 (LGPL-2.1, só como serviço no servidor), chamado
  # antes de cada mensagem ao dono (raiz/revisor.py). RAIZ_LANGUAGETOOL_URL=http://localhost:8010 no .env.
  revisor:
    build: ./languagetool
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8010"  # só a própria máquina

  # Armazenamento compatível com S3 para os arquivos do motor, para quem não usa o Cloudflare R2: SeaweedFS (Apache-2.0).
  # Sobe só com --profile armazem. S3 em http://localhost:8333; RAIZ_ARMAZEM_URL=s3://raiz-motor/producao e
  # RAIZ_S3_ENDPOINT=http://localhost:8333 no .env (crie o balde com: aws --endpoint-url ... s3 mb s3://raiz-motor).
  armazem:
    image: chrislusf/seaweedfs:3.68  # conferir a versão estável mais recente antes de subir
    profiles: ["armazem"]
    restart: unless-stopped
    command: server -s3 -dir=/data -volume.max=0 -s3.port=8333
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - armazem:/data

volumes:
  banco:
  armazem:
