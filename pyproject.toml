[project]
name = "raiz"
version = "0.1.0"
description = "Produto da Raíz: coleta, funil, título, agentes e aprendizado em cima do motor de dados"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6",
    "anthropic>=1.0",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "langfuse>=3.0",
    "genai-prices>=0.0.30",
    "pywa>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=43",
    "httpx>=0.27",
    "pycryptodome>=3.20",
    "dlt[duckdb,postgres]>=1.10",
    "duckdb>=1.4",
    "requests-cache>=1.2",
    "tifffile>=2024.1",
    "pmtiles>=3.8.1",
    "mapbox-vector-tile>=2.2.0",
    "pillow>=13.0.0",
    "boto3>=1.35",
    # documentos (raiz/documentos): modelos .docx, páginas de editais e PDF
    "docxtpl>=0.20",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "mcp==2.3.0",
    "slowapi>=0.1.9",
    "PyJWT[crypto]>=2.10,<3",
    "redis>=5,<7",
    "qrcode>=8,<9",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    # título (raiz/titulo): laudo HTML por imóvel e WARC das consultas públicas
    "jinja2>=3.1",
    "warcio>=1.7",
    "reportlab>=4.0",  # PDF privado da ficha da fazenda
    "mapie>=1.6,<2",
    "lifelines>=0.30",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    "pt-core-news-sm",
    "spacy>=3.8,<3.9",
]

[project.optional-dependencies]
metadados = ["croissant-baker==0.8.3", "mlcroissant==1.1.1"]
# o que o motor (motor/) precisa além do pacote; ver requirements.txt
motor = ["requests>=2.31", "rasterio>=1.3", "exactextract>=0.2", "scipy>=1.11"]
nativo = [
    "raiz-iov",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "maturin>=1.7",
    "moto[s3]>=5.0",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
raiz = "raiz.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raiz"]

[tool.ruff]
line-length = 120
target-version = "py312"
# o motor tem estilo próprio e não é reescrito
# o código gerado pelo Catala (raiz/regras/gerado) não é formatado nem checado
extend-exclude = ["motor", "raiz/regras/gerado"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["testes", "raiz/vigilancia/testes"]
markers = ["banco: precisa de PostgreSQL com PostGIS (RAIZ_BANCO_URL_TESTE)"]
# aviso que nasce dentro do DuckDB (fetch_df usa drop(inplace=True)), não no código da Raíz
filterwarnings = [
    "ignore:The inplace keyword in DataFrame.drop is deprecated",
    # de dentro do mapbox-vector-tile (encoder usa shapely.ops.transform)
    "ignore:The 'shapely.ops.transform\\(\\)' function is deprecated:DeprecationWarning",
]

[tool.uv.workspace]
members = [
    "nativo/raiz_iov",
]

[tool.uv.sources]
raiz-iov = { workspace = true }
pt-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl" }
