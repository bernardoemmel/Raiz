title = "Segredos da Raíz: regras oficiais e exceções estritas"

[extend]
useDefault = true

[allowlist]
description = "Nome de coluna documentada, confundido com chave por conter usucapiao"
condition = "AND"
paths = ['''^docs/colunas\.md$''']
regexTarget = "secret"
regexes = ['''^regularizacao_chance_12m$''']

[[allowlists]]
description = "Commit público fixo do repositório da InfoAmazonia (raiz/coleta/compromissos_secundarios.py), não é credencial"
regexTarget = "match"
regexes = ['''350f832309a89286af119785deb580db84e4f643''']
